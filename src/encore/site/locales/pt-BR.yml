    p: "Cada barra é uma turnê em um ano: uma turnê que atravessa vários anos aparece uma vez por ano, porque a mediana não pode ser combinada entre anos. O losango marca a média. Células com menos de {{ min_tour_shows }} shows ficam de fora."
    title: "{{ band }}: idade mediana do repertório por turnê"
    desc: "Gráfico de barras da idade mediana do repertório de cada turnê e ano de {{ band }}. A tabela de dados abaixo lista todos os valores."
    caption: "Idade mediana do repertório de cada turnê e ano; o losango é a média."
  rotation:
    h: "O quanto os shows mudam: rotação"
    p: "O quanto o setlist muda de um show para o seguinte dentro de uma turnê, por ano. 0 é o mesmo setlist toda noite; 1 é nenhuma música em comum."
    title: "{{ band }}: rotação por ano"
    desc: "Gráfico de linhas da rotação de {{ band }} por ano. A tabela de dados abaixo lista todos os valores."
    caption: "Rotação entre shows consecutivos da mesma turnê."
  survival:
    h: "Quanto tempo as músicas duram: sobrevivência"
    p: "Parcela das músicas da banda ainda no setlist após t shows desde a estreia ao vivo, por álbum de estúdio. Uma curva que fica alta é um álbum cujas músicas se tornaram permanentes; uma que cai rápido é um álbum que passou."
    title: "{{ band }}: sobrevivência das músicas por álbum"
    desc: "Curvas de Kaplan-Meier da parcela de músicas ainda tocadas após t shows, uma por álbum, para {{ band }}. A tabela de dados abaixo dá a parcela em 25, 50, 100, 200 e 400 shows."
    caption: "Curvas de Kaplan-Meier, janela N = {{ n_window }} shows; a linha tracejada é o conjunto de músicas elegíveis."
  albums:
    h: Álbuns
    p: "Músicas elegíveis da discografia por álbum de referência (o álbum de estúdio mais antigo que contém a música). A sobrevivência mediana é em shows."
  others:
    h: Outras bandas
findings:
  common: "A sobrevivência é contada em shows, não em anos, e anos com menos de {{ min_pairs }} pares de shows consecutivos ficam fora da rotação (veja Metodologia)."
  arctic_monkeys:
    lead: "O Arctic Monkeys toca hoje um show mais estável do que nos primeiros anos."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) caiu de {{ arctic_monkeys_rot_first3 }} ({{ arctic_monkeys_rot_first3_years }}) para {{ arctic_monkeys_rot_last3 }} ({{ arctic_monkeys_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. AM perdeu {{ arctic_monkeys_album_am_abandoned }} de suas {{ arctic_monkeys_album_am_songs }} músicas elegíveis e {{ arctic_monkeys_album_am_final }} ainda estavam no setlist após {{ arctic_monkeys_album_am_final_t }} shows, enquanto Suck It and See está em {{ arctic_monkeys_album_suck_it_and_see_final }} após {{ arctic_monkeys_album_suck_it_and_see_final_t }}. No conjunto, {{ arctic_monkeys_final }} das músicas elegíveis ainda eram tocadas após {{ arctic_monkeys_final_t }} shows, e a sobrevivência mediana é de {{ arctic_monkeys_median }} shows."
    caveats:
      1: "The Car ({{ arctic_monkeys_album_the_car_final }} após {{ arctic_monkeys_album_the_car_final_t }} shows) é recente demais para avaliar."
  oasis:
    lead: "O Oasis tocava um show quase fixo, e (What's the Story) Morning Glory? é o álbum cujas músicas mais ficaram nele."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) caiu de {{ oasis_rot_first3 }} ({{ oasis_rot_first3_years }}) para {{ oasis_rot_last3 }} ({{ oasis_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes, e foi {{ oasis_rot_2025 }} nos shows de 2025. (What's the Story) Morning Glory? perdeu {{ oasis_album_whats_the_story_morning_glory_abandoned }} de {{ oasis_album_whats_the_story_morning_glory_songs }} músicas elegíveis e {{ oasis_album_whats_the_story_morning_glory_final }} ainda eram tocadas após {{ oasis_album_whats_the_story_morning_glory_final_t }} shows, enquanto Be Here Now perdeu {{ oasis_album_be_here_now_abandoned }} de {{ oasis_album_be_here_now_songs }} (mediana de {{ oasis_album_be_here_now_median }} shows). No conjunto, {{ oasis_final }} das músicas elegíveis ainda estavam no setlist após {{ oasis_final_t }} shows, e a sobrevivência mediana é de {{ oasis_median }} shows."
    caveats:
      1: "Os três últimos anos com shows suficientes incluem 2025, depois de uma lacuna sem shows nos dados entre {{ oasis_gap_from }} e {{ oasis_gap_to }}."
      2: "Dig Out Your Soul ({{ oasis_album_dig_out_your_soul_final }} após {{ oasis_album_dig_out_your_soul_final_t }} shows, {{ oasis_album_dig_out_your_soul_songs }} músicas) é uma curva curta demais para avaliar."
      3: "A sobrevivência mediana é de {{ oasis_median }} shows, contra {{ metallica_median }} do Metallica, mas 50 shows cobrem períodos de calendário muito diferentes nas duas bandas (veja Metodologia)."
  linkin_park:
    lead: "O setlist do Linkin Park não ficou mais estável com o tempo, e seus primeiros álbuns mantiveram mais músicas no set do que a maioria dos mais recentes."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) foi de {{ linkin_park_rot_first3 }} ({{ linkin_park_rot_first3_years }}) para {{ linkin_park_rot_last3 }} ({{ linkin_park_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. Hybrid Theory ainda tinha {{ linkin_park_album_hybrid_theory_final }} de suas músicas após {{ linkin_park_album_hybrid_theory_final_t }} shows e Meteora {{ linkin_park_album_meteora_final }} após {{ linkin_park_album_meteora_final_t }}, enquanto The Hunting Party perdeu {{ linkin_park_album_the_hunting_party_abandoned }} de {{ linkin_park_album_the_hunting_party_songs }} (mediana de {{ linkin_park_album_the_hunting_party_median }} shows) e One More Light {{ linkin_park_album_one_more_light_abandoned }} de {{ linkin_park_album_one_more_light_songs }} (mediana de {{ linkin_park_album_one_more_light_median }}). No conjunto, a sobrevivência mediana é de {{ linkin_park_median }} shows."
    caveats:
      1: "Os últimos três anos com shows suficientes vêm depois de uma lacuna sem shows nos dados entre {{ linkin_park_gap_from }} e {{ linkin_park_gap_to }}."
      2: "From Zero perdeu {{ linkin_park_album_from_zero_abandoned }} de suas {{ linkin_park_album_from_zero_songs }} músicas até agora, mas sua curva cobre só {{ linkin_park_album_from_zero_final_t }} shows, curta demais para dizer quanto tempo elas vão ficar."
  twenty_one_pilots:
    lead: "O Twenty One Pilots virou um show quase fixo, e Blurryface é o álbum que ficou."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) caiu de {{ twenty_one_pilots_rot_first3 }} ({{ twenty_one_pilots_rot_first3_years }}) para {{ twenty_one_pilots_rot_last3 }} ({{ twenty_one_pilots_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. Blurryface perdeu {{ twenty_one_pilots_album_blurryface_abandoned }} de {{ twenty_one_pilots_album_blurryface_songs }} músicas e {{ twenty_one_pilots_album_blurryface_final }} ainda eram tocadas após {{ twenty_one_pilots_album_blurryface_final_t }} shows, enquanto {{ twenty_one_pilots_album_twenty_one_pilots_abandoned }} de {{ twenty_one_pilots_album_twenty_one_pilots_songs }} músicas de Twenty One Pilots (mediana de {{ twenty_one_pilots_album_twenty_one_pilots_median }} shows) e {{ twenty_one_pilots_album_vessel_abandoned }} de {{ twenty_one_pilots_album_vessel_songs }} de Vessel (mediana de {{ twenty_one_pilots_album_vessel_median }}) foram abandonadas. No conjunto, a sobrevivência mediana é de {{ twenty_one_pilots_median }} shows."
    caveats:
      1: "Scaled and Icy perdeu {{ twenty_one_pilots_album_scaled_and_icy_abandoned }} de {{ twenty_one_pilots_album_scaled_and_icy_songs }} músicas com mediana de {{ twenty_one_pilots_album_scaled_and_icy_median }} shows, mas sua curva cobre só {{ twenty_one_pilots_album_scaled_and_icy_final_t }} shows."
  muse:
    lead: "O Muse muda menos o setlist do que antes, e o álbum de estreia saiu em boa parte do set."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) caiu de {{ muse_rot_first3 }} ({{ muse_rot_first3_years }}) para {{ muse_rot_last3 }} ({{ muse_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes, com um pico de {{ muse_rot_2018 }} em 2018 no meio do caminho. {{ muse_album_showbiz_abandoned }} de {{ muse_album_showbiz_songs }} músicas elegíveis de Showbiz foram abandonadas (mediana de {{ muse_album_showbiz_median }} shows), enquanto Absolution ainda tinha {{ muse_album_absolution_final }} após {{ muse_album_absolution_final_t }} shows. {{ muse_surv_500 }} das músicas elegíveis ainda estavam no setlist 500 shows após a estreia ao vivo, e {{ muse_final }} após {{ muse_final_t }} shows, onde terminam os dados."
    caveats:
      1: "Os primeiros anos são frágeis: só {{ muse_1995_rate }} das músicas tocadas em 1995 foram reconhecidas no MusicBrainz (veja Metodologia)."
  metallica:
    lead: "O Metallica passou de um show quase fixo nos anos 1980 para um que muda muito, e seu setlist ficou mais jovem depois de cada um dos três últimos álbuns."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) subiu de {{ metallica_rot_first3 }} nos três primeiros anos com shows suficientes ({{ metallica_rot_first3_years }}) para {{ metallica_rot_last3 }} nos três últimos. Por turnê, foi {{ metallica_tour_world_magnetic_rotation }} em World Magnetic (2008–2010) e {{ metallica_tour_m72_world_tour_rotation }} na M72 World Tour (2023–2026), e por ano {{ metallica_rot_2023 }} em 2023 e {{ metallica_rot_2024 }} em 2024. A idade média do repertório (quão antigas eram as músicas tocadas) caiu {{ dip_metallica_death_magnetic_size }}, {{ dip_metallica_hardwired_size }} e {{ dip_metallica_72_seasons_size }} anos em torno de Death Magnetic (2008), Hardwired… to Self-Destruct (2016) e 72 Seasons (2023). Ride the Lightning perdeu {{ metallica_album_ride_the_lightning_abandoned }} de {{ metallica_album_ride_the_lightning_songs }} músicas elegíveis e {{ metallica_album_ride_the_lightning_final }} ainda eram tocadas após {{ metallica_album_ride_the_lightning_final_t }} shows, enquanto Kill 'Em All perdeu {{ metallica_album_kill_em_all_abandoned }} de {{ metallica_album_kill_em_all_songs }}, mas só após uma mediana de {{ metallica_album_kill_em_all_median }} shows."
    caveats:
      1: "A mediana geral é de {{ metallica_median }} shows; 50 shows cobrem um período maior para o Metallica do que para as bandas que mais tocam, então compare com cuidado (veja Metodologia)."
      2: "Os dados mostram que a rotação do Metallica subiu, não por quê, e uma queda na idade do repertório em torno do lançamento de um álbum não mostra que o lançamento a causou (veja a página inicial)."
  avenged_sevenfold:
    lead: "O Avenged Sevenfold muda o setlist bem menos do que nos primeiros anos, e dois álbuns dos anos 2010, Hail to the King e The Stage, saíram rápido do set."
    numbers: "A rotação (o quanto as músicas mudam de um show para o seguinte) caiu de {{ avenged_sevenfold_rot_first3 }} ({{ avenged_sevenfold_rot_first3_years }}) para {{ avenged_sevenfold_rot_last3 }} ({{ avenged_sevenfold_rot_last3_years }}), com a maior parte da queda entre {{ avenged_sevenfold_rot_2007 }} em 2007 e {{ avenged_sevenfold_rot_2010 }} em 2010. The Stage perdeu {{ avenged_sevenfold_album_the_stage_abandoned }} de {{ avenged_sevenfold_album_the_stage_songs }} músicas (mediana de {{ avenged_sevenfold_album_the_stage_median }} shows) e Hail to the King {{ avenged_sevenfold_album_hail_to_the_king_abandoned }} de {{ avenged_sevenfold_album_hail_to_the_king_songs }} (mediana de {{ avenged_sevenfold_album_hail_to_the_king_median }}). No conjunto, {{ avenged_sevenfold_abandoned }} de suas {{ avenged_sevenfold_songs }} músicas elegíveis foram abandonadas e a sobrevivência mediana é de {{ avenged_sevenfold_median }} shows."
    caveats:
      1: "A curva de The Stage cobre só {{ avenged_sevenfold_album_the_stage_final_t }} shows."
      2: "O álbum mais novo, Life Is But a Dream…, perdeu {{ avenged_sevenfold_album_life_is_but_a_dream_abandoned }} de {{ avenged_sevenfold_album_life_is_but_a_dream_songs }}, mas sua curva cobre só {{ avenged_sevenfold_album_life_is_but_a_dream_final_t }} shows."
      3: "Os últimos três anos com shows suficientes vêm depois de uma lacuna sem shows nos dados entre {{ avenged_sevenfold_gap_from }} e {{ avenged_sevenfold_gap_to }}."
read:
  label: "Como ler"
  age: "Cada linha é uma banda. A altura é a idade média, em anos, das músicas tocadas naquele ano. Linha subindo: o set se apoia em músicas mais antigas; linha caindo: músicas mais novas assumiram."
  rotation: "Cada linha é uma banda. A altura mostra o quanto um show difere do seguinte na mesma turnê: 0 é as mesmas músicas toda noite, 1 é nenhuma música em comum. Linha caindo: show mais fixo; subindo: show mais variável."
  rotation_small: "Cada quadro é uma banda, na mesma escala de 0 (as mesmas músicas toda noite) a 1 (nenhuma música em comum entre shows consecutivos). Linha caindo: o show ficou mais fixo; subindo: ficou mais variável."
  tours: "Cada barra é uma turnê em um ano. Barra maior: em geral, foram tocadas músicas mais antigas (idade mediana, em anos); o losango marca a média."
  survival: "Cada linha acompanha as músicas de um álbum desde a noite em que foram tocadas ao vivo pela primeira vez. A altura é a parcela ainda no setlist (100% no início): linha alta e plana, as músicas ficaram; queda forte, saíram rápido. O eixo conta shows, não anos; a linha cinza marca a metade."
caveats:
  summary: "Ressalvas e limites"
