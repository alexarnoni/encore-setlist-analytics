home:
  kicker: como as bandas usam a própria discografia
  title: Como as bandas usam a própria discografia
  lede: "Este site mostra o que sete bandas tocaram nos seus shows, noite após noite, ao longo de toda a carreira: as músicas de cada show, o chamado setlist. Os setlists vêm do setlist.fm, preenchido por fãs, e a discografia (álbuns, singles, datas de lançamento) vem do MusicBrainz. Com isso medimos três coisas: quão antigas são as músicas que uma banda toca, o quanto o show muda de uma noite para outra e quanto tempo uma música continua sendo tocada."
  lede_note: "Todo número vem de dados agregados; como ele é construído está na página de metodologia."
  f1:
    kicker: "01 quão antigas são as músicas"
    h: "Depois de cada um dos três últimos álbuns, o setlist do Metallica ficou mais jovem por um tempo e depois envelheceu de novo."
    stat_label: "anos a menos no setlist do Metallica em 2023, o ano de 72 Seasons"
    explain: "A idade do repertório é quão antigas eram as músicas tocadas numa noite, contando desde o lançamento de cada uma: em 6, a música média do show tinha seis anos. Cada linha é uma banda. Linha subindo: o set se apoia em músicas mais antigas; linha caindo: músicas novas assumiram."
    numbers: "A idade média do repertório do Metallica caiu de {{ dip_metallica_72_seasons_before }} anos em 2022 para {{ dip_metallica_72_seasons_low }} em 2023, o ano de 72 Seasons, e quedas de {{ dip_metallica_death_magnetic_size }} e {{ dip_metallica_hardwired_size }} anos aparecem em torno de Death Magnetic (2008) e de Hardwired… to Self-Destruct (2016); a idade voltou a subir em um ou dois anos a cada vez. No Avenged Sevenfold e no Linkin Park também há quedas em torno de lançamentos, mas menores, e a idade subiu em anos de álbum novo (The Stage, 2016; Living Things, 2012): o padrão é claro para uma banda e apenas um indício para as outras duas."
    caveats:
      1: "Uma queda que coincide com o lançamento de um álbum não mostra que o lançamento a causou: turnês e escolhas de setlist também mexem nesse número."
      2: "Os anos de lançamento vêm do MusicBrainz e foram acrescentados a este texto à mão; os dados por trás dos gráficos não os incluem."
      3: "Idade média do repertório do Metallica antes, no ponto mais baixo e depois de cada queda: {{ dip_metallica_death_magnetic_before }} → {{ dip_metallica_death_magnetic_low }} → {{ dip_metallica_death_magnetic_after }} (2007, 2009, 2010), {{ dip_metallica_hardwired_before }} → {{ dip_metallica_hardwired_low }} → {{ dip_metallica_hardwired_after }} (2015, 2018, 2019) e {{ dip_metallica_72_seasons_before }} → {{ dip_metallica_72_seasons_low }} → {{ dip_metallica_72_seasons_after }} (2022, 2023, 2025). Avenged Sevenfold: quedas de {{ dip_avenged_nightmare_size }} (Nightmare, 2010) e {{ dip_avenged_hail_to_the_king_size }} anos (Hail to the King, 2013). Linkin Park: {{ dip_linkin_minutes_to_midnight_size }} (Minutes to Midnight, 2007) e {{ dip_linkin_a_thousand_suns_size }} anos (A Thousand Suns, 2010)."
    title: "Idade do repertório por ano: Metallica, Avenged Sevenfold e Linkin Park"
    desc: "Gráfico de linhas da idade média do repertório por ano para Metallica, Avenged Sevenfold e Linkin Park. A tabela de dados abaixo lista todos os valores."
    caption: "Idade média do repertório das músicas tocadas em cada ano, ponderada pelo número de vezes que cada música foi tocada."
  f2:
    kicker: "02 o quanto os shows mudam"
    h: "A maioria dessas bandas passou a tocar quase o mesmo show toda noite; o Metallica foi no sentido contrário."
    lead_more: "Na turnê mais recente, o Metallica tocou sets bem diferentes de uma noite para a outra, em parte por desenho da turnê (veja as ressalvas). Nos primeiros anos, tocava quase as mesmas músicas toda noite."
    explain: "Rotação mede o quanto o setlist muda de um show para o seguinte na mesma turnê. Perto de 0, a banda toca praticamente o mesmo show toda noite; acima de 0,5, mais da metade das músicas de duas noites seguidas aparece em só uma delas; perto de 1, quase nada se repete. Cada quadro é uma banda, na mesma escala de 0 a 1."
    numbers: "Entre os três primeiros e os três últimos anos com shows suficientes de cada banda, a rotação caiu em cinco das sete; a maior queda foi a do Twenty One Pilots, de {{ twenty_one_pilots_rot_first3 }} para {{ twenty_one_pilots_rot_last3 }}. O Metallica fez o caminho oposto: nenhuma turnê dos anos 1980 passou de {{ metallica_tour_damaged_justice_rotation }}, e a M72 World Tour (2023–2026) chegou a {{ metallica_tour_m72_world_tour_rotation }}."
    caveats:
      1: "Na M72 World Tour o Metallica toca duas noites seguidas na mesma cidade com setlists diferentes (o formato 'No Repeat Weekend'), então boa parte dessa rotação alta é desenho da turnê. Isso é contexto público sobre a turnê: os dados agregados não trazem cidades, então não confirmam nem descartam a explicação. O que eles mostram é que nenhuma música foi tocada em 9 de cada 10 shows da turnê."
      2: "O formato não explica tudo: a rotação do Metallica já era {{ metallica_tour_world_magnetic_rotation }} na World Magnetic (2008–2010). Por ano, foi {{ metallica_rot_2023 }} em 2023 e {{ metallica_rot_2024 }} em 2024; dois shows seguidos da M72 tinham em média {{ metallica_tour_m72_world_tour_overlap }} das músicas somadas dos dois em comum, contra {{ metallica_tour_damaged_justice_overlap }} a {{ metallica_tour_kill_em_all_for_one_overlap }} nas turnês dos anos 1980."
      3: "A rotação compara shows consecutivos da mesma turnê; por isso, uma banda que toca um set fixo em turnê fica perto de 0, por maior que seja a sua discografia. Os dados mostram que a rotação do Metallica subiu, não por quê."
      4: "Valores nos três primeiros e nos três últimos anos com shows suficientes: Arctic Monkeys {{ arctic_monkeys_rot_first3 }} → {{ arctic_monkeys_rot_last3 }}, Oasis {{ oasis_rot_first3 }} → {{ oasis_rot_last3 }}, Muse {{ muse_rot_first3 }} → {{ muse_rot_last3 }}, Avenged Sevenfold {{ avenged_sevenfold_rot_first3 }} → {{ avenged_sevenfold_rot_last3 }}, Metallica {{ metallica_rot_first3 }} → {{ metallica_rot_last3 }}. O Linkin Park não caiu ({{ linkin_park_rot_first3 }} → {{ linkin_park_rot_last3 }}), e seus três últimos anos ({{ linkin_park_rot_last3_years }}) vêm depois de uma lacuna sem shows nos dados entre {{ linkin_park_gap_from }} e {{ linkin_park_gap_to }}."
      5: "Anos com menos de {{ min_pairs }} pares de shows consecutivos ficam fora das médias; os anos por trás de cada valor estão listados nas páginas das bandas."
    cell_title: "{{ band }}: rotação por ano"
    cell_desc: "Gráfico de linhas da rotação de {{ band }} por ano, em escala de 0 a 1."
  f3:
    kicker: "03 quanto tempo as músicas duram"
    h: "Alguns álbuns permanecem no setlist por muito tempo, enquanto outros somem rápido."
    stat_label: "das músicas de (What's the Story) Morning Glory? ainda eram tocadas {{ oasis_album_whats_the_story_morning_glory_final_t }} shows depois da estreia ao vivo ({{ oasis_album_whats_the_story_morning_glory_final_t_cal }} de turnê)"
    explain: "A sobrevivência é quanto tempo uma música continua sendo tocada nos shows depois da sua estreia ao vivo. Cada linha do gráfico é um álbum do Oasis, e a altura é a parcela de suas músicas ainda no setlist: linha alta e plana, as músicas ficaram; queda forte, saíram rápido. O eixo conta shows, não anos: para o Oasis, 100 shows são {{ oasis_surv_100_cal }} de turnê. A linha cinza marca a metade, que o Oasis cruza em {{ oasis_median }} shows ({{ oasis_surv_median_cal }})."
    numbers: "Dentro do Oasis, (What's the Story) Morning Glory? perdeu {{ oasis_album_whats_the_story_morning_glory_abandoned }} de suas {{ oasis_album_whats_the_story_morning_glory_songs }} músicas, enquanto Be Here Now perdeu {{ oasis_album_be_here_now_abandoned }} de {{ oasis_album_be_here_now_songs }}, com metade delas fora do setlist após {{ oasis_album_be_here_now_median }} shows ({{ oasis_album_be_here_now_median_cal }})."
    caveats:
      1: "As bandas são comparadas 500 shows após a estreia ao vivo da música porque a curva de todas alcança esse ponto, e cada valor ali se apoia em pelo menos {{ linkin_park_atrisk_500 }} músicas ainda acompanhadas."
      2: "Onde cada curva termina é um detalhe de cada banda, não um ranking, porque uma carreira mais longa termina mais baixo: Arctic Monkeys {{ arctic_monkeys_final }} após {{ arctic_monkeys_final_t }} shows ({{ arctic_monkeys_final_t_cal }}), Oasis {{ oasis_final }} após {{ oasis_final_t }} ({{ oasis_final_t_cal }}), Linkin Park {{ linkin_park_final }} após {{ linkin_park_final_t }} ({{ linkin_park_final_t_cal }}), Twenty One Pilots {{ twenty_one_pilots_final }} após {{ twenty_one_pilots_final_t }} ({{ twenty_one_pilots_final_t_cal }}), Muse {{ muse_final }} após {{ muse_final_t }} ({{ muse_final_t_cal }}), Metallica {{ metallica_final }} após {{ metallica_final_t }} ({{ metallica_final_t_cal }}), Avenged Sevenfold {{ avenged_sevenfold_final }} após {{ avenged_sevenfold_final_t }} ({{ avenged_sevenfold_final_t_cal }})."
      3: "A curva do Oasis é quase plana depois de 500 shows: {{ oasis_surv_500 }} em 500 shows e {{ oasis_final }} em {{ oasis_final_t }}."
      4: "Dig Out Your Soul mostra {{ oasis_album_dig_out_your_soul_final }} ainda tocadas, mas sua curva termina em {{ oasis_album_dig_out_your_soul_final_t }} shows ({{ oasis_album_dig_out_your_soul_final_t_cal }}) e cobre só {{ oasis_album_dig_out_your_soul_songs }} músicas: um acompanhamento curto, interrompido enquanto as músicas ainda são tocadas (uma curva censurada), que não resolve se elas vão permanecer."
      5: "O fim de qualquer curva depende das poucas músicas ainda acompanhadas, e o acompanhamento é contado em shows, não em anos (veja Metodologia). As equivalências em anos usam a média de shows por ano de cada banda nos dados, contando só os anos com shows, e são aproximadas."
      6: "Só entram na conta as músicas tocadas pelo menos 3 vezes e encontradas na discografia do MusicBrainz (veja Metodologia)."
      7: "Parcela das músicas ainda no setlist 500 shows após a estreia ao vivo: Metallica {{ metallica_surv_500 }}, Twenty One Pilots {{ twenty_one_pilots_surv_500 }}, Avenged Sevenfold {{ avenged_sevenfold_surv_500 }}, Muse {{ muse_surv_500 }}, Arctic Monkeys {{ arctic_monkeys_surv_500 }}, Oasis {{ oasis_surv_500 }} e Linkin Park {{ linkin_park_surv_500 }}."
    title: "Oasis: sobrevivência das músicas por álbum"
    desc: "Curvas de Kaplan-Meier da parcela de músicas do Oasis ainda tocadas após t shows, uma por álbum. A tabela de dados abaixo dá a parcela em 25, 50, 100, 200 e 400 shows."
    caption: "Curvas de Kaplan-Meier. Uma música é dada como abandonada quando fica {{ n_window }} shows ou mais fora do setlist sem voltar."
