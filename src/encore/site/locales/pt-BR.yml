  survival:
    h: Sobrevivência das músicas
    p: "Parcela das músicas do catálogo da banda ainda no setlist após t shows desde a estreia ao vivo, por álbum de estúdio. Uma curva que fica alta é um álbum cujas músicas se tornaram permanentes; uma que cai rápido é um álbum que passou."
    title: "{{ band }}: sobrevivência das músicas por álbum"
    desc: "Curvas de Kaplan-Meier da parcela de músicas ainda tocadas após t shows, uma por álbum, para {{ band }}. A tabela de dados abaixo dá a parcela em 25, 50, 100, 200 e 400 shows."
    caption: "Curvas de Kaplan-Meier, janela N = {{ n_window }} shows; a linha tracejada é o conjunto de músicas elegíveis."
  albums:
    h: Álbuns
    p: "Músicas elegíveis do catálogo por álbum de referência (o álbum de estúdio mais antigo que contém a música). A sobrevivência mediana é em shows."
  others:
    h: Outras bandas
findings:
  arctic_monkeys:
    p:
      1: "A rotação caiu de {{ arctic_monkeys_rot_first3 }} ({{ arctic_monkeys_rot_first3_years }}) para {{ arctic_monkeys_rot_last3 }} ({{ arctic_monkeys_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes: o set ficou mais estável."
      2: "AM manteve o lugar: {{ arctic_monkeys_album_am_abandoned }} de suas {{ arctic_monkeys_album_am_songs }} músicas elegíveis foram abandonadas e {{ arctic_monkeys_album_am_final }} ainda estavam no setlist após {{ arctic_monkeys_album_am_final_t }} shows, enquanto Suck It and See está em {{ arctic_monkeys_album_suck_it_and_see_final }} após {{ arctic_monkeys_album_suck_it_and_see_final_t }}."
      3: "No conjunto, {{ arctic_monkeys_final }} das músicas elegíveis ainda eram tocadas após {{ arctic_monkeys_final_t }} shows e a sobrevivência mediana é de {{ arctic_monkeys_median }} shows. The Car ({{ arctic_monkeys_album_the_car_final }} após {{ arctic_monkeys_album_the_car_final_t }} shows) é recente demais para avaliar."
  oasis:
    p:
      1: "A rotação caiu de {{ oasis_rot_first3 }} ({{ oasis_rot_first3_years }}) para {{ oasis_rot_last3 }} ({{ oasis_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes, e foi {{ oasis_rot_2025 }} nos shows de 2025."
      2: "O catálogo se divide por álbum: (What's the Story) Morning Glory? perdeu {{ oasis_album_whats_the_story_morning_glory_abandoned }} de {{ oasis_album_whats_the_story_morning_glory_songs }} músicas elegíveis e {{ oasis_album_whats_the_story_morning_glory_final }} ainda eram tocadas após {{ oasis_album_whats_the_story_morning_glory_final_t }} shows, enquanto Be Here Now perdeu {{ oasis_album_be_here_now_abandoned }} de {{ oasis_album_be_here_now_songs }} (mediana de {{ oasis_album_be_here_now_median }} shows)."
      3: "No conjunto, {{ oasis_final }} das músicas elegíveis ainda estavam no setlist após {{ oasis_final_t }} shows. A sobrevivência mediana é de {{ oasis_median }} shows, contra {{ metallica_median }} do Metallica, mas 50 shows cobrem períodos de calendário muito diferentes nas duas bandas (veja Metodologia)."
  linkin_park:
    p:
      1: "A rotação não caiu: foi de {{ linkin_park_rot_first3 }} ({{ linkin_park_rot_first3_years }}) para {{ linkin_park_rot_last3 }} ({{ linkin_park_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes, e esses últimos anos vêm depois de uma lacuna sem shows nos dados entre {{ linkin_park_gap_from }} e {{ linkin_park_gap_to }}."
      2: "Os primeiros álbuns duram: Hybrid Theory ainda tinha {{ linkin_park_album_hybrid_theory_final }} de suas músicas após {{ linkin_park_album_hybrid_theory_final_t }} shows e Meteora {{ linkin_park_album_meteora_final }} após {{ linkin_park_album_meteora_final_t }}. The Hunting Party perdeu {{ linkin_park_album_the_hunting_party_abandoned }} de {{ linkin_park_album_the_hunting_party_songs }} (mediana de {{ linkin_park_album_the_hunting_party_median }} shows) e One More Light {{ linkin_park_album_one_more_light_abandoned }} de {{ linkin_park_album_one_more_light_songs }} (mediana de {{ linkin_park_album_one_more_light_median }})."
      3: "From Zero perdeu {{ linkin_park_album_from_zero_abandoned }} de suas {{ linkin_park_album_from_zero_songs }} músicas até agora, mas sua curva cobre só {{ linkin_park_album_from_zero_final_t }} shows, curta demais para dizer quanto tempo elas vão ficar. No conjunto, a sobrevivência mediana é de {{ linkin_park_median }} shows."
  twenty_one_pilots:
    p:
      1: "A rotação caiu de {{ twenty_one_pilots_rot_first3 }} ({{ twenty_one_pilots_rot_first3_years }}) para {{ twenty_one_pilots_rot_last3 }} ({{ twenty_one_pilots_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes: o set ficou quase fixo."
      2: "Blurryface é o álbum que ficou: {{ twenty_one_pilots_album_blurryface_abandoned }} de {{ twenty_one_pilots_album_blurryface_songs }} músicas abandonadas e {{ twenty_one_pilots_album_blurryface_final }} ainda tocadas após {{ twenty_one_pilots_album_blurryface_final_t }} shows. Scaled and Icy perdeu {{ twenty_one_pilots_album_scaled_and_icy_abandoned }} de {{ twenty_one_pilots_album_scaled_and_icy_songs }} com mediana de {{ twenty_one_pilots_album_scaled_and_icy_median }} shows, embora sua curva cubra só {{ twenty_one_pilots_album_scaled_and_icy_final_t }} shows."
      3: "Seus primeiros álbuns saíram do set: {{ twenty_one_pilots_album_twenty_one_pilots_abandoned }} de {{ twenty_one_pilots_album_twenty_one_pilots_songs }} músicas de Twenty One Pilots (mediana de {{ twenty_one_pilots_album_twenty_one_pilots_median }} shows) e {{ twenty_one_pilots_album_vessel_abandoned }} de {{ twenty_one_pilots_album_vessel_songs }} de Vessel (mediana de {{ twenty_one_pilots_album_vessel_median }}). No conjunto, a sobrevivência mediana é de {{ twenty_one_pilots_median }} shows."
  muse:
    p:
      1: "A rotação caiu de {{ muse_rot_first3 }} ({{ muse_rot_first3_years }}) para {{ muse_rot_last3 }} ({{ muse_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes, com um pico de {{ muse_rot_2018 }} em 2018 no meio do caminho."
      2: "{{ muse_surv_500 }} das músicas elegíveis ainda estavam no setlist 500 shows após a estreia ao vivo, e {{ muse_final }} após {{ muse_final_t }} shows, onde terminam os dados."
      3: "A estreia se apagou: {{ muse_album_showbiz_abandoned }} de {{ muse_album_showbiz_songs }} músicas elegíveis de Showbiz foram abandonadas (mediana de {{ muse_album_showbiz_median }} shows), enquanto Absolution ainda tinha {{ muse_album_absolution_final }} após {{ muse_album_absolution_final_t }} shows. Os primeiros anos são frágeis: só {{ muse_1995_rate }} das execuções de 1995 foram reconhecidas no catálogo."
  metallica:
    p:
      1: "A rotação subiu de {{ metallica_rot_first3 }} nos três primeiros anos com shows suficientes ({{ metallica_rot_first3_years }}) para {{ metallica_rot_last3 }} nos três últimos. Por turnê, foi {{ metallica_tour_world_magnetic_rotation }} em World Magnetic (2008–2010) e {{ metallica_tour_m72_world_tour_rotation }} na M72 World Tour (2023–2026), e por ano {{ metallica_rot_2023 }} em 2023 e {{ metallica_rot_2024 }} em 2024."
      2: "A idade média do seu repertório caiu {{ dip_metallica_death_magnetic_size }}, {{ dip_metallica_hardwired_size }} e {{ dip_metallica_72_seasons_size }} anos em torno de Death Magnetic (2008), Hardwired… to Self-Destruct (2016) e 72 Seasons (2023), o padrão mais claro dos dados (a página inicial compara as outras bandas)."
      3: "Alguns álbuns antigos duram muito: Ride the Lightning perdeu {{ metallica_album_ride_the_lightning_abandoned }} de {{ metallica_album_ride_the_lightning_songs }} músicas elegíveis e {{ metallica_album_ride_the_lightning_final }} ainda eram tocadas após {{ metallica_album_ride_the_lightning_final_t }} shows, enquanto Kill 'Em All perdeu {{ metallica_album_kill_em_all_abandoned }} de {{ metallica_album_kill_em_all_songs }}, mas só após uma mediana de {{ metallica_album_kill_em_all_median }} shows. A mediana geral é de {{ metallica_median }} shows; 50 shows cobrem um período maior para o Metallica do que para as bandas que mais tocam, então compare com cuidado (veja Metodologia)."
  avenged_sevenfold:
    p:
      1: "A rotação caiu de {{ avenged_sevenfold_rot_first3 }} ({{ avenged_sevenfold_rot_first3_years }}) para {{ avenged_sevenfold_rot_last3 }} ({{ avenged_sevenfold_rot_last3_years }}), com a maior parte da queda entre {{ avenged_sevenfold_rot_2007 }} em 2007 e {{ avenged_sevenfold_rot_2010 }} em 2010."
      2: "Os álbuns dos anos 2010 não se sustentaram: The Stage perdeu {{ avenged_sevenfold_album_the_stage_abandoned }} de {{ avenged_sevenfold_album_the_stage_songs }} músicas (mediana de {{ avenged_sevenfold_album_the_stage_median }} shows, embora sua curva cubra só {{ avenged_sevenfold_album_the_stage_final_t }}) e Hail to the King {{ avenged_sevenfold_album_hail_to_the_king_abandoned }} de {{ avenged_sevenfold_album_hail_to_the_king_songs }} (mediana de {{ avenged_sevenfold_album_hail_to_the_king_median }})."
      3: "No conjunto, {{ avenged_sevenfold_abandoned }} de suas {{ avenged_sevenfold_songs }} músicas elegíveis foram abandonadas e a sobrevivência mediana é de {{ avenged_sevenfold_median }} shows. O álbum mais novo, Life Is But a Dream…, perdeu {{ avenged_sevenfold_album_life_is_but_a_dream_abandoned }} de {{ avenged_sevenfold_album_life_is_but_a_dream_songs }}, mas sua curva cobre só {{ avenged_sevenfold_album_life_is_but_a_dream_final_t }} shows."
