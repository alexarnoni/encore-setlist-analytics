home:
  kicker: como as bandas usam o próprio catálogo
  title: Como as bandas usam o próprio catálogo
  lede: "O Encore mede como sete bandas usam o próprio catálogo no palco: quão velhos são os setlists, o quanto mudam de uma noite para outra e quanto tempo uma música dura. Todo número vem de dados agregados de setlists; como ele é construído está na página de metodologia."
  f1:
    kicker: "01 idade do repertório"
    h: "Álbuns novos podem deixar o setlist mais jovem por um ou dois anos: com clareza no Metallica, de forma fraca no Avenged Sevenfold e no Linkin Park"
    stat_label: "anos a menos na idade média do repertório do Metallica em 2023, o ano de 72 Seasons: de {{ dip_metallica_72_seasons_before }} em 2022 para {{ dip_metallica_72_seasons_low }}"
    p:
      1: "A idade média do repertório do Metallica caiu em torno de cada um dos seus três álbuns mais recentes: de {{ dip_metallica_death_magnetic_before }} para {{ dip_metallica_death_magnetic_low }} anos entre 2007 e 2009 (Death Magnetic, 2008), de {{ dip_metallica_hardwired_before }} para {{ dip_metallica_hardwired_low }} entre 2015 e 2018 (Hardwired… to Self-Destruct, 2016) e de {{ dip_metallica_72_seasons_before }} para {{ dip_metallica_72_seasons_low }} entre 2022 e 2023 (72 Seasons, 2023). Em todas as vezes voltou a subir em um ou dois anos, para {{ dip_metallica_death_magnetic_after }} em 2010, {{ dip_metallica_hardwired_after }} em 2019 e {{ dip_metallica_72_seasons_after }} em 2025."
      2: "Para Avenged Sevenfold e Linkin Park o padrão é mais fraco e não é consistente. A idade média do Avenged Sevenfold caiu {{ dip_avenged_nightmare_size }} e {{ dip_avenged_hail_to_the_king_size }} anos, respectivamente, em torno de Nightmare (2010) e Hail to the King (2013), mas subiu de {{ dip_avenged_the_stage_before }} para {{ dip_avenged_the_stage_low }} em 2016, o ano de The Stage. A do Linkin Park caiu {{ dip_linkin_minutes_to_midnight_size }} e {{ dip_linkin_a_thousand_suns_size }} anos, respectivamente, em torno de Minutes to Midnight (2007) e A Thousand Suns (2010), mas subiu de {{ dip_linkin_living_things_before }} para {{ dip_linkin_living_things_low }} em 2012, o ano de Living Things. São quedas pequenas perto das do Metallica: um padrão claro para uma banda e apenas um indício para as outras duas."
      3: "Os anos de lançamento dos álbuns vêm do MusicBrainz e foram acrescentados a este texto à mão; os dados por trás dos gráficos não os incluem. A idade do repertório também varia com turnês e escolhas de setlist que nada têm a ver com álbuns novos, então uma queda que coincide com um lançamento não mostra que o lançamento a causou."
    title: "Idade do repertório por ano: Metallica, Avenged Sevenfold e Linkin Park"
    desc: "Gráfico de linhas da idade média do repertório por ano para Metallica, Avenged Sevenfold e Linkin Park. A tabela de dados abaixo lista todos os valores."
    caption: "Idade média do repertório das músicas tocadas em cada ano, ponderada por execuções."
  f2:
    kicker: "02 rotação"
    h: "A maioria das bandas se fixou em um show mais estável com o tempo; o Metallica foi no sentido oposto, e o Linkin Park também não se fixou"
    p:
      1: "Comparando os três primeiros anos com shows suficientes de cada banda com os três últimos, a rotação caiu para Arctic Monkeys ({{ arctic_monkeys_rot_first3 }} → {{ arctic_monkeys_rot_last3 }}), Oasis ({{ oasis_rot_first3 }} → {{ oasis_rot_last3 }}), Twenty One Pilots ({{ twenty_one_pilots_rot_first3 }} → {{ twenty_one_pilots_rot_last3 }}), Muse ({{ muse_rot_first3 }} → {{ muse_rot_last3 }}) e Avenged Sevenfold ({{ avenged_sevenfold_rot_first3 }} → {{ avenged_sevenfold_rot_last3 }}). Não caiu para o Linkin Park ({{ linkin_park_rot_first3 }} → {{ linkin_park_rot_last3 }}), cujos últimos três anos ({{ linkin_park_rot_last3_years }}) vêm depois de uma lacuna sem shows nos dados entre {{ linkin_park_gap_from }} e {{ linkin_park_gap_to }}, e subiu bastante para o Metallica ({{ metallica_rot_first3 }} → {{ metallica_rot_last3 }})."
      2: "Nas turnês dos anos 1980, a rotação do Metallica ficou entre {{ metallica_tour_kill_em_all_for_one_rotation }} (Kill 'Em All for One, 1983) e {{ metallica_tour_damaged_justice_rotation }} (Damaged Justice, 1988–1989). Foi {{ metallica_tour_world_magnetic_rotation }} em World Magnetic (2008–2010) e {{ metallica_tour_m72_world_tour_rotation }} na M72 World Tour (2023–2026); por ano-calendário, foi {{ metallica_rot_2023 }} em 2023 e {{ metallica_rot_2024 }} em 2024."
      3: "A rotação é medida entre shows consecutivos da mesma turnê, então uma banda que toca um set fixo em turnê fica perto de 0, por maior que seja o seu catálogo. Os dados mostram que o Metallica mudou; não dizem por quê. Anos com menos de {{ min_pairs }} pares de shows ficam fora das médias."
    cell_title: "{{ band }}: rotação por ano"
    cell_desc: "Gráfico de linhas da rotação de {{ band }} por ano, em escala de 0 a 1."
  f3:
    kicker: "03 sobrevivência das músicas"
    h: "500 shows após a estreia ao vivo, entre {{ linkin_park_surv_500 }} (Linkin Park) e {{ metallica_surv_500 }} (Metallica) das músicas de uma banda ainda estão no setlist"
    stat_label: "das músicas elegíveis do Oasis ainda estão no setlist 500 shows após a estreia ao vivo, com {{ oasis_atrisk_500 }} músicas ainda acompanhadas nesse ponto"
    p:
      1: "Para comparar as bandas com justiça, todas são lidas no mesmo horizonte: 500 shows após a estreia ao vivo da música, que a curva de todas as bandas alcança. Nele, a parcela das músicas elegíveis ainda no setlist é de {{ metallica_surv_500 }} no Metallica, {{ twenty_one_pilots_surv_500 }} no Twenty One Pilots, {{ avenged_sevenfold_surv_500 }} no Avenged Sevenfold, {{ muse_surv_500 }} no Muse, {{ arctic_monkeys_surv_500 }} no Arctic Monkeys, {{ oasis_surv_500 }} no Oasis e {{ linkin_park_surv_500 }} no Linkin Park. Cada valor se apoia em pelo menos {{ linkin_park_atrisk_500 }} músicas ainda acompanhadas."
      2: "Onde cada curva termina é um detalhe de cada banda, não um ranking, porque depende de quanto tempo a banda foi acompanhada e uma carreira mais longa termina mais baixo. O Arctic Monkeys termina em {{ arctic_monkeys_final }} após {{ arctic_monkeys_final_t }} shows, o Oasis em {{ oasis_final }} após {{ oasis_final_t }}, o Linkin Park em {{ linkin_park_final }} após {{ linkin_park_final_t }}, o Twenty One Pilots em {{ twenty_one_pilots_final }} após {{ twenty_one_pilots_final_t }}, o Muse em {{ muse_final }} após {{ muse_final_t }}, o Metallica em {{ metallica_final }} após {{ metallica_final_t }} e o Avenged Sevenfold em {{ avenged_sevenfold_final }} após {{ avenged_sevenfold_final_t }}. A curva do Oasis é quase plana entre os dois pontos: {{ oasis_surv_500 }} em 500 shows e {{ oasis_final }} em {{ oasis_final_t }}."
      3: "Dentro do Oasis, a divisão é por álbum. (What's the Story) Morning Glory? perdeu {{ oasis_album_whats_the_story_morning_glory_abandoned }} de suas {{ oasis_album_whats_the_story_morning_glory_songs }} músicas elegíveis e {{ oasis_album_whats_the_story_morning_glory_final }} ainda eram tocadas após {{ oasis_album_whats_the_story_morning_glory_final_t }} shows; Definitely Maybe está em {{ oasis_album_definitely_maybe_final }} após {{ oasis_album_definitely_maybe_final_t }} shows; Be Here Now perdeu {{ oasis_album_be_here_now_abandoned }} de {{ oasis_album_be_here_now_songs }}, com sobrevivência mediana de {{ oasis_album_be_here_now_median }} shows."
      4: "Dig Out Your Soul mostra {{ oasis_album_dig_out_your_soul_final }} ainda tocadas, mas sua curva termina em {{ oasis_album_dig_out_your_soul_final_t }} shows e cobre só {{ oasis_album_dig_out_your_soul_songs }} músicas: uma curva curta e censurada, que não resolve se essas músicas vão permanecer. O fim de qualquer curva depende das poucas músicas ainda acompanhadas, e o acompanhamento é contado em shows, não em anos (veja Metodologia)."
    title: "Oasis: sobrevivência das músicas por álbum"
    desc: "Curvas de Kaplan-Meier da parcela de músicas do Oasis ainda tocadas após t shows, uma por álbum. A tabela de dados abaixo dá a parcela em 25, 50, 100, 200 e 400 shows."
    caption: "Curvas de Kaplan-Meier, janela N = {{ n_window }} shows."
  bands:
    h: As bandas
    p: "Uma página por banda, com seus próprios gráficos e achados."
comparison:
  kicker: sete bandas, uma escala
  title: Comparação
  lede: As mesmas medidas para todas as bandas, nos mesmos eixos.
  age:
    h: Idade do repertório por ano
    p: "Média de anos entre o primeiro lançamento de uma música e a noite em que ela é tocada. Uma linha que sobe é uma banda apoiada em material mais antigo; uma linha que cai é um álbum novo tomando conta do show."
    title: Idade do repertório por ano, todas as bandas
    desc: "Gráfico de linhas da idade média do repertório por ano para as sete bandas. A tabela de dados abaixo lista todos os valores."
    caption: "Idade média do repertório das músicas tocadas em cada ano, ponderada por execuções."
  rotation:
    h: Rotação por ano
    p: "O quanto uma banda muda o setlist de um show para o seguinte dentro de uma turnê. 0 é o mesmo setlist toda noite; 1 é nenhuma música em comum."
    title: Rotação por ano, todas as bandas
    desc: "Gráfico de linhas da rotação por ano para as sete bandas. A tabela de dados abaixo lista todos os valores."
    caption: "Rotação entre shows consecutivos da mesma turnê, por ano."
  survival:
    h: Sobrevivência mediana por banda
    p: "Quantos shows uma música dura no repertório ao vivo, contados da estreia ao último show em que aparece. A mediana é o número de shows após o qual metade das músicas da banda foi abandonada; ela não é atingida quando menos da metade chega a ser."
    note: "Medida em shows, não em tempo (veja Metodologia): 50 shows cobrem períodos muito diferentes para cada banda. Abandonada significa que a música saiu do setlist por pelo menos 50 shows e não voltou; censurada, que ainda é tocada ou que voltou."
methodology:
  kicker: como os números são feitos
  title: Metodologia
  lede: Como os números deste site são construídos, o que eles podem e não podem sustentar, e onde os dados são fracos.
  scope:
    h: Escopo e fontes
    p:
      1: "O Encore acompanha {{ bands_count }} bandas ({{ band_list }}), fixas nesta versão. Os setlists (quais músicas foram tocadas em quais shows) vêm do setlist.fm; o catálogo (álbuns, singles, faixas e datas de lançamento) vem do MusicBrainz."
      2: "Tudo aqui é calculado a partir de {{ shows_total }} shows e publicado apenas de forma agregada: por banda, turnê, ano e álbum."
  kpi:
    h: O que os números significam
    item:
      1: "<strong>Cobertura do catálogo.</strong> Uma execução é reconhecida quando seu título corresponde a uma música do catálogo do MusicBrainz. A parcela de execuções reconhecidas, ponderada por quantas vezes cada música foi tocada, é a principal medida de qualidade dos dados (tabela abaixo). A parcela ligada a um álbum de estúdio aparece ao lado, só como informação."
      2: "<strong>O que fica de fora.</strong> Covers, entradas de fita e intros são excluídos dos números do catálogo. Medleys (títulos unidos por ' / ') são separados em músicas distintas."
      3: "<strong>Idade do repertório.</strong> Para cada execução, o ano do show menos o ano do primeiro lançamento oficial da música (o menor entre o ano do álbum de estúdio e o do primeiro lançamento da gravação), nunca abaixo de zero. O valor de um ano é a média das execuções. No gráfico por turnê, cada barra é a mediana de uma turnê em um ano, porque a mediana não pode ser reconstruída entre vários anos."
      4: "<strong>Rotação.</strong> Para shows consecutivos da mesma turnê, calcula-se a sobreposição entre os dois setlists (índice de Jaccard). Rotação é 1 menos a sobreposição média: 0 é o mesmo setlist toda noite, 1 é nenhuma música em comum. Turnês com menos de 5 shows não são pontuadas, e um par pertence ao ano do segundo show. Anos com menos de 5 pares aparecem como marcadores vazados e ficam fora da linha."
      5: "<strong>Álbum de uma música.</strong> O álbum de estúdio mais antigo que a contém. Músicas do catálogo sem álbum de estúdio (singles, lados B, outras gravações) formam um grupo próprio, non-album, em vez de serem descartadas."
  survival:
    h: Sobrevivência das músicas e a regra de abandono
    p:
      1: "A sobrevivência é medida em shows, não em tempo de calendário, para que um hiato não seja lido como abandono de músicas. A duração de uma música vai do primeiro ao último show em que foi tocada, inclusive: uma música tocada em um único show dura 1."
      2: "Uma música é abandonada quando saiu do setlist e não voltou: sua última aparição está pelo menos N shows antes do fim do histórico, com N = 50 por padrão. Toda outra música é censurada: continua sendo tocada, ou ficou fora por um tempo e voltou. Só entram na análise músicas do catálogo com pelo menos 3 execuções, ligadas a um álbum de estúdio ou a uma gravação com ano de lançamento conhecido."
      3: "Conta apenas a última lacuna. Uma versão anterior tratava a primeira lacuna como o evento e marcava como abandonados clássicos que descansaram por uma turnê e voltaram; a regra da última lacuna corrige isso."
      4: "As comparações entre bandas são feitas em um horizonte comum, 500 shows após a estreia ao vivo da música, que a curva de todas as bandas alcança, e não no fim de cada curva: até onde uma curva se estende depende de quanto tempo a banda foi acompanhada, então uma banda com carreira mais longa terminaria mais baixo só por isso. O fim de cada curva continua sendo informado por banda, com o número de shows que ele cobre."
  sensitivity:
    h: Quanto o N importa?
    p:
      1: "Sobrevivência mediana, em shows, das músicas elegíveis de cada banda para três tamanhos de janela. Onde a mediana quase não se move, a escolha de N não está guiando o resultado; onde ela se move muito, leia o número com isso em mente."
    note: "Não atingida: a curva nunca cai abaixo de 50%."
  policy:
    h: Política de dados
    p:
      1: "Os dados brutos do setlist.fm existem apenas enquanto o pipeline roda e são apagados ao fim de cada execução. Só resultados agregados são guardados e publicados; por isso este site nunca mostra um setlist individual, data de show, local ou identificador do setlist.fm."
      2: "Os títulos de músicas, quando aparecem, são os títulos canônicos do MusicBrainz (CC0). Os dados de setlist são creditados ao <a href='{{ setlistfm_url }}'>setlist.fm</a> e usados apenas para fins não comerciais; os dados de catálogo vêm do <a href='{{ musicbrainz_url }}'>MusicBrainz</a>."
  limits:
    h: Limitações conhecidas
    item:
      1: "<strong>Uma janela em shows não é uma janela em tempo.</strong> Cinquenta shows passam em meses para uma banda que faz muitas datas e em mais de um ano para uma que faz poucas. De 2015 em diante, um ano ativo médio tem cerca de {{ twenty_one_pilots_pairs_avg }} pares de shows para o Twenty One Pilots (seu ano mais cheio tem {{ twenty_one_pilots_pairs_max }}), {{ arctic_monkeys_pairs_avg }} para o Arctic Monkeys, {{ muse_pairs_avg }} para o Muse, {{ oasis_pairs_avg }} para o Oasis, e {{ metallica_pairs_avg }}, {{ avenged_sevenfold_pairs_avg }} e {{ linkin_park_pairs_avg }} para Metallica, Avenged Sevenfold e Linkin Park (pares contam um pouco menos que shows). Compare bandas com isso em mente."
      2: "<strong>Muse, 1994 e 1995.</strong> A cobertura do catálogo é baixa nos dois primeiros anos do Muse: {{ muse_1994_matched }} de {{ muse_1994_performances }} execuções reconhecidas em 1994 e {{ muse_1995_matched }} de {{ muse_1995_performances }} em 1995 ({{ muse_1995_rate }}). Juntos são {{ muse_weak_share }} das execuções do Muse, então a cobertura geral ({{ muse_match }}) quase não muda, mas os números do Muse nesses anos são frágeis. Causa provável: demos e EPs antigos que não estão no catálogo usado aqui."
      3: "<strong>Jams, solos e entradas genéricas</strong> como '(jam)' não podem ser distinguidos com segurança nos dados; quando correspondem a uma música do catálogo, são contados como qualquer outra. Isso pode aumentar os setlists, reduzir a sobreposição entre shows e incluir músicas espúrias na sobrevivência."
      4: "<strong>Gravações sem ano de lançamento</strong> não têm posição na linha do tempo do catálogo e ficam fora da sobrevivência. Músicas só de gravação que têm ano entram sob non-album."
      5: "<strong>As datas de lançamento vêm do MusicBrainz</strong> e podem estar erradas. Casos suspeitos são revisados e corrigidos por uma lista manual de correções no repositório."
  match:
    h: Cobertura do catálogo por banda
    p:
      1: "Parcela das execuções reconhecidas no catálogo, ponderada por execuções (a medida principal), e a parcela ligada a um álbum de estúdio (secundária, informativa)."
about:
  kicker: o que é isto
  title: Sobre
  lede: O Encore é um projeto de portfólio de dados, sem fins comerciais, sobre como as bandas usam o próprio catálogo nos shows.
  purpose:
    h: Para que serve
    p:
      1: "Ele pergunta como sete bandas tratam o catálogo no palco: vivem do passado ou apostam em material novo, os shows mudam de uma noite para outra, e quanto tempo uma música sobrevive no repertório ao vivo. Duas outras perguntas, a estrutura do show e as diferenças por país ou tipo de casa, ficam para versões futuras."
      2: "É também um exemplo prático de um pipeline de dados pequeno e completo, com o método escrito ao lado dos gráficos."
  stack:
    h: Como é feito
    item:
      1: "<strong>Ingestão.</strong> Clientes Python das APIs do setlist.fm e do MusicBrainz, orquestrados pelo Apache Airflow (LocalExecutor) em Docker Compose, em uma máquina virtual ARM64."
      2: "<strong>Armazenamento e transformação.</strong> PostgreSQL 16 e dbt Core. Os dados brutos do setlist.fm ficam em um schema efêmero, esvaziado ao fim de cada execução; os modelos de staging e intermediários são views; só os marts agregados persistem."
      3: "<strong>Análise.</strong> pandas e lifelines (Kaplan-Meier) para rotação e sobrevivência das músicas."
      4: "<strong>Este site.</strong> Um site estático gerado a partir dos marts com Python, Jinja2 e matplotlib (os gráficos são SVG inline, sem biblioteca de gráficos em JavaScript), em português e inglês, no Cloudflare Pages. Sem API e sem banco de dados em tempo de execução."
  source:
    h: Código
    p:
      1: "O código, as notas de metodologia e as especificações estão no <a href='{{ repo_url }}'>GitHub</a>. Feito por <a href='{{ author_url }}'>alexarnoni</a>."
