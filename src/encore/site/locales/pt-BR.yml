band:
  kicker: perfil da banda
  intro: "Setlists de {{ band }}: o que a banda tocou nos shows, noite após noite (dados do setlist.fm); a discografia vem do MusicBrainz."
  chip_years: "{{ first }}–{{ last }}"
  chip_shows: "{{ n }} shows"
  chip_match: "{{ pct }} das músicas tocadas reconhecidas no MusicBrainz"
  chip_median: "metade das músicas deixou o setlist após {{ n }} shows, {{ cal }} de turnê (sobrevivência mediana)"
  context_label: "Contexto, não algo que os dados provam:"
  findings:
    h: O que se destaca
  age:
    h: "Quão antigas eram as músicas: idade do repertório"
    p: "Média, em anos, entre o lançamento de cada música e a noite em que ela foi tocada, ponderada pelo número de vezes que cada uma foi tocada. Perto de 0, a banda toca material recém-lançado; em 6, a música média do show tinha seis anos. Aqui há uma única linha, a de {{ band }}: subindo, o set se apoia em material mais antigo; caindo, músicas novas assumiram."
    title: "{{ band }}: idade do repertório por ano"
    desc: "Gráfico de linhas da idade média do repertório de {{ band }} por ano. A tabela de dados abaixo lista todos os valores."
    caption: "Idade média do repertório por ano, ponderada pelo número de vezes que cada música foi tocada."
  tours:
    h: Idade mediana por turnê
    p: "Cada barra é uma turnê em um ano (uma turnê que atravessa vários anos aparece uma vez por ano) e mostra a idade mediana das músicas tocadas: metade tinha essa idade ou menos. O losango marca a média. Barra baixa: repertório quase todo recente; barra alta: apoio em músicas antigas. Turnês com menos de {{ min_tour_shows }} shows num ano ficam de fora."
    title: "{{ band }}: idade mediana do repertório por turnê"
    desc: "Gráfico de barras da idade mediana do repertório de cada turnê e ano de {{ band }}. A tabela de dados abaixo lista todos os valores."
    caption: "Idade mediana do repertório de cada turnê e ano; o losango é a média."
  rotation:
    h: "O quanto os shows mudam: rotação"
    p: "Rotação mede o quanto o setlist muda de um show para o seguinte na mesma turnê, por ano. Perto de 0, a banda toca praticamente o mesmo show toda noite; acima de 0,5, mais da metade das músicas de duas noites seguidas aparece em só uma delas; perto de 1, quase nada se repete. Aqui há uma única linha, a de {{ band }}: caindo, o show ficou mais fixo; subindo, mais variável."
    title: "{{ band }}: rotação por ano"
    desc: "Gráfico de linhas da rotação de {{ band }} por ano. A tabela de dados abaixo lista todos os valores."
    caption: "Rotação entre shows consecutivos da mesma turnê."
  survival:
    h: "Quanto tempo as músicas duram: sobrevivência"
    p: "Cada linha acompanha as músicas de um álbum de estúdio desde a noite em que foram tocadas ao vivo pela primeira vez, e a altura é a parcela ainda no setlist (100% no início). Linha alta e plana: as músicas ficaram; queda forte: saíram rápido. O eixo conta shows, não anos: para {{ band }}, que nos anos em que tocou faz em média cerca de {{ per_year }} shows por ano, 100 shows são {{ cal_100 }} de turnê. A linha cinza marca a metade. {{ median }}"
    median: "{{ band }} cruza essa marca, ou seja, perde metade das músicas, em {{ median }} shows, {{ median_cal }} de turnê."
    no_median: "Nos dados, {{ band }} não chega a perder metade das músicas."
    title: "{{ band }}: sobrevivência das músicas por álbum"
    desc: "Curvas de Kaplan-Meier da parcela de músicas ainda tocadas após t shows, uma por álbum, para {{ band }}. A tabela de dados abaixo dá a parcela em 25, 50, 100, 200 e 400 shows."
    caption: "Curvas de Kaplan-Meier. Uma música é dada como abandonada quando fica {{ n_window }} shows ou mais fora do setlist sem voltar; a linha tracejada reúne todas as músicas da discografia analisadas."
  albums:
    h: Álbuns
    p: "Músicas da discografia tocadas pelo menos 3 vezes, por álbum de referência (o álbum de estúdio mais antigo que contém a música). A sobrevivência mediana é em shows."
  others:
    h: Outras bandas
album_labels:
  twenty_one_pilots:
    twenty_one_pilots: "Twenty One Pilots (álbum de estreia)"
  metallica:
    metallica: "Metallica (álbum homônimo)"
  avenged_sevenfold:
    avenged_sevenfold: "Avenged Sevenfold (álbum homônimo)"
findings:
  common: "A sobrevivência é contada em shows, não em anos, e anos com menos de {{ min_pairs }} pares de shows consecutivos ficam fora da rotação. Só entram na sobrevivência as músicas da discografia (encontradas no MusicBrainz) tocadas pelo menos 3 vezes (veja Metodologia)."
  calendar: "A conversão de shows em anos usa a média de shows por ano de {{ band }} nos dados (cerca de {{ per_year }}, contando só os anos com shows e só os shows do setlist.fm) e é aproximada."
  arctic_monkeys:
    lead: "O Arctic Monkeys toca hoje um show mais estável do que nos primeiros anos."
    context: "a banda passou do rock de garagem dos primeiros discos ao som mais elaborado e arranjado de AM (2013) e The Car (2022), e o show ficou mais planejado."
    numbers: "A rotação (o quanto o setlist muda de um show para o seguinte) caiu de {{ arctic_monkeys_rot_first3 }} ({{ arctic_monkeys_rot_first3_years }}) para {{ arctic_monkeys_rot_last3 }} ({{ arctic_monkeys_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. O álbum AM manteve {{ arctic_monkeys_album_am_final }} de suas músicas no setlist no fim dos dados. No conjunto, metade das músicas da banda deixa o setlist após {{ arctic_monkeys_median }} shows, {{ arctic_monkeys_surv_median_cal }} de turnê."
    caveats:
      1: "The Car ({{ arctic_monkeys_album_the_car_final }} após {{ arctic_monkeys_album_the_car_final_t }} shows, {{ arctic_monkeys_album_the_car_final_t_cal }}) é recente demais para avaliar."
      2: "AM perdeu {{ arctic_monkeys_album_am_abandoned }} de suas {{ arctic_monkeys_album_am_songs }} músicas e manteve {{ arctic_monkeys_album_am_final }} após {{ arctic_monkeys_album_am_final_t }} shows ({{ arctic_monkeys_album_am_final_t_cal }}); Suck It and See está em {{ arctic_monkeys_album_suck_it_and_see_final }} após {{ arctic_monkeys_album_suck_it_and_see_final_t }} ({{ arctic_monkeys_album_suck_it_and_see_final_t_cal }}). No conjunto, {{ arctic_monkeys_final }} das músicas ainda eram tocadas após {{ arctic_monkeys_final_t }} shows."
  oasis:
    lead: "O Oasis tocava um show quase fixo, e (What's the Story) Morning Glory? é o álbum cujas músicas mais ficaram nele."
    context: "a banda se separou em 2009 e voltou em 2025 com a turnê Live '25, um show de reencontro centrado nos maiores sucessos."
    numbers: "A rotação (o quanto o setlist muda de um show para o seguinte) caiu de {{ oasis_rot_first3 }} ({{ oasis_rot_first3_years }}) para {{ oasis_rot_last3 }} ({{ oasis_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. {{ oasis_album_whats_the_story_morning_glory_final }} das músicas de (What's the Story) Morning Glory? ainda eram tocadas no fim dos dados. No conjunto, metade das músicas da banda deixa o setlist após {{ oasis_median }} shows, {{ oasis_surv_median_cal }} de turnê."
    caveats:
      1: "Os três últimos anos com shows suficientes incluem 2025, depois de uma lacuna sem shows nos dados entre {{ oasis_gap_from }} e {{ oasis_gap_to }}."
      2: "Dig Out Your Soul ({{ oasis_album_dig_out_your_soul_final }} após {{ oasis_album_dig_out_your_soul_final_t }} shows, {{ oasis_album_dig_out_your_soul_final_t_cal }}, {{ oasis_album_dig_out_your_soul_songs }} músicas) é um acompanhamento curto demais para avaliar."
      3: "A sobrevivência mediana é de {{ oasis_median }} shows ({{ oasis_surv_median_cal }}), contra {{ metallica_median }} do Metallica ({{ metallica_surv_median_cal }}); como cada banda toca um número diferente de shows por ano, compare em anos com cuidado (veja Metodologia)."
      4: "(What's the Story) Morning Glory? perdeu {{ oasis_album_whats_the_story_morning_glory_abandoned }} de {{ oasis_album_whats_the_story_morning_glory_songs }} músicas, com {{ oasis_album_whats_the_story_morning_glory_final }} ainda tocadas após {{ oasis_album_whats_the_story_morning_glory_final_t }} shows ({{ oasis_album_whats_the_story_morning_glory_final_t_cal }}); Be Here Now perdeu {{ oasis_album_be_here_now_abandoned }} de {{ oasis_album_be_here_now_songs }}."
  linkin_park:
    lead: "O setlist do Linkin Park não ficou mais estável com o tempo, e seus primeiros álbuns mantiveram mais músicas no set do que a maioria dos mais recentes."
    context: "depois da morte de Chester Bennington, em 2017, a banda voltou em 2024 com Emily Armstrong e o álbum From Zero; os últimos anos do gráfico são dessa fase."
    numbers: "A rotação (o quanto o setlist muda de um show para o seguinte) foi de {{ linkin_park_rot_first3 }} ({{ linkin_park_rot_first3_years }}) para {{ linkin_park_rot_last3 }} ({{ linkin_park_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. Hybrid Theory ainda tinha {{ linkin_park_album_hybrid_theory_final }} de suas músicas no setlist no fim dos dados, enquanto The Hunting Party perdeu {{ linkin_park_album_the_hunting_party_abandoned }} de {{ linkin_park_album_the_hunting_party_songs }}."
    caveats:
      1: "Os últimos três anos com shows suficientes vêm depois de uma lacuna sem shows nos dados entre {{ linkin_park_gap_from }} e {{ linkin_park_gap_to }}."
      2: "From Zero perdeu {{ linkin_park_album_from_zero_abandoned }} de suas {{ linkin_park_album_from_zero_songs }} músicas até agora, mas só foi acompanhado por {{ linkin_park_album_from_zero_final_t }} shows ({{ linkin_park_album_from_zero_final_t_cal }}), pouco para dizer quanto tempo elas vão ficar."
      3: "Hybrid Theory manteve {{ linkin_park_album_hybrid_theory_final }} após {{ linkin_park_album_hybrid_theory_final_t }} shows ({{ linkin_park_album_hybrid_theory_final_t_cal }}) e Meteora {{ linkin_park_album_meteora_final }} após {{ linkin_park_album_meteora_final_t }} ({{ linkin_park_album_meteora_final_t_cal }}); The Hunting Party tem mediana de {{ linkin_park_album_the_hunting_party_median }} shows e One More Light perdeu {{ linkin_park_album_one_more_light_abandoned }} de {{ linkin_park_album_one_more_light_songs }} (mediana de {{ linkin_park_album_one_more_light_median }}). No conjunto, a mediana é de {{ linkin_park_median }} shows ({{ linkin_park_surv_median_cal }})."
  twenty_one_pilots:
    lead: "O Twenty One Pilots virou um show quase fixo, e Blurryface é o álbum que ficou."
    context: "a banda virou a dupla Tyler Joseph e Josh Dun em 2011, e desde a era Blurryface (2015) os shows seguem um roteiro cada vez mais fechado, com narrativa e produção fixas; é o que se espera de uma rotação perto de zero."
    numbers: "A rotação (o quanto o setlist muda de uma noite para a seguinte) caiu de {{ twenty_one_pilots_rot_first3 }} nos três primeiros anos com shows suficientes ({{ twenty_one_pilots_rot_first3_years }}) para {{ twenty_one_pilots_rot_last3 }} nos três últimos ({{ twenty_one_pilots_rot_last3_years }}). Blurryface é o álbum cujas músicas mais ficaram: {{ twenty_one_pilots_album_blurryface_final }} ainda eram tocadas no fim dos dados, enquanto as músicas do álbum de estreia Twenty One Pilots já saíram todas do set. No conjunto, metade das músicas da banda deixa o setlist após {{ twenty_one_pilots_median }} shows, {{ twenty_one_pilots_surv_median_cal }} de turnê."
    caveats:
      1: "Scaled and Icy perdeu {{ twenty_one_pilots_album_scaled_and_icy_abandoned }} de suas {{ twenty_one_pilots_album_scaled_and_icy_songs }} músicas, mas só foi acompanhado por {{ twenty_one_pilots_album_scaled_and_icy_final_t }} shows ({{ twenty_one_pilots_album_scaled_and_icy_final_t_cal }}), pouco para dizer quanto tempo as músicas dos álbuns recentes ficam."
      2: "Blurryface perdeu {{ twenty_one_pilots_album_blurryface_abandoned }} de {{ twenty_one_pilots_album_blurryface_songs }} músicas e manteve {{ twenty_one_pilots_album_blurryface_final }} após {{ twenty_one_pilots_album_blurryface_final_t }} shows ({{ twenty_one_pilots_album_blurryface_final_t_cal }}). Do álbum de estreia Twenty One Pilots, {{ twenty_one_pilots_album_twenty_one_pilots_abandoned }} de {{ twenty_one_pilots_album_twenty_one_pilots_songs }} músicas foram abandonadas (mediana de {{ twenty_one_pilots_album_twenty_one_pilots_median }} shows, {{ twenty_one_pilots_album_twenty_one_pilots_median_cal }}), e de Vessel, {{ twenty_one_pilots_album_vessel_abandoned }} de {{ twenty_one_pilots_album_vessel_songs }} (mediana de {{ twenty_one_pilots_album_vessel_median }})."
  muse:
    lead: "O Muse muda menos o setlist do que antes, e o álbum de estreia saiu em boa parte do set."
    context: "os shows foram ficando maiores e mais produzidos ao longo da carreira, do rock de casas pequenas dos primeiros discos aos shows de estádio."
    numbers: "A rotação (o quanto o setlist muda de um show para o seguinte) caiu de {{ muse_rot_first3 }} ({{ muse_rot_first3_years }}) para {{ muse_rot_last3 }} ({{ muse_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. {{ muse_album_showbiz_abandoned }} de {{ muse_album_showbiz_songs }} músicas do álbum de estreia Showbiz foram abandonadas, enquanto Absolution ainda tinha {{ muse_album_absolution_final }} de suas músicas no setlist no fim dos dados."
    caveats:
      1: "Os primeiros anos são frágeis: só {{ muse_1995_rate }} das músicas tocadas em 1995 foram reconhecidas no MusicBrainz (veja Metodologia)."
      2: "Showbiz tem mediana de {{ muse_album_showbiz_median }} shows ({{ muse_album_showbiz_median_cal }}); Absolution ainda tinha {{ muse_album_absolution_final }} após {{ muse_album_absolution_final_t }} shows ({{ muse_album_absolution_final_t_cal }}). O pico de rotação de {{ muse_rot_2018 }} em 2018 fica no meio da queda. {{ muse_surv_500 }} das músicas ainda estavam no setlist 500 shows após a estreia ao vivo, e {{ muse_final }} após {{ muse_final_t }} shows ({{ muse_final_t_cal }}), onde terminam os dados."
  metallica:
    lead: "O Metallica passou de um show quase fixo nos anos 1980 para um que muda muito, e seu setlist ficou mais jovem depois de cada um dos três últimos álbuns."
    context: "nos anos 1980 o set era quase fixo; desde os anos 2000 as turnês passaram a variar mais, e a M72 levou isso ao limite com o formato 'No Repeat Weekend'."
    numbers: "A rotação (o quanto o setlist muda de um show para o seguinte) subiu de {{ metallica_rot_first3 }} nos três primeiros anos com shows suficientes ({{ metallica_rot_first3_years }}) para {{ metallica_rot_last3 }} nos três últimos. Na M72 World Tour (2023–2026) ela chegou a {{ metallica_tour_m72_world_tour_rotation }}, em parte por desenho da turnê (veja o contexto abaixo e as ressalvas). A idade média do repertório (quão antigas eram as músicas tocadas) caiu {{ dip_metallica_72_seasons_size }} anos em torno de 72 Seasons (2023), e quedas parecidas apareceram em Death Magnetic (2008) e em Hardwired… to Self-Destruct (2016)."
    caveats:
      1: "Na M72 World Tour o Metallica toca duas noites seguidas na mesma cidade com setlists diferentes (o formato 'No Repeat Weekend'), então boa parte dessa rotação alta é desenho da turnê. Isso é contexto público sobre a turnê: os dados agregados não trazem cidades, então não confirmam nem descartam a explicação. O que eles mostram é que nenhuma música foi tocada em 9 de cada 10 shows da turnê."
      2: "O formato não explica tudo: a rotação do Metallica já era {{ metallica_tour_world_magnetic_rotation }} na World Magnetic (2008–2010), e foi {{ metallica_rot_2023 }} em 2023 e {{ metallica_rot_2024 }} em 2024."
      3: "A sobrevivência mediana geral é de {{ metallica_median }} shows ({{ metallica_surv_median_cal }}); 50 shows cobrem um período diferente para cada banda, então compare com cuidado (veja Metodologia)."
      4: "Ride the Lightning perdeu {{ metallica_album_ride_the_lightning_abandoned }} de {{ metallica_album_ride_the_lightning_songs }} músicas e manteve {{ metallica_album_ride_the_lightning_final }} após {{ metallica_album_ride_the_lightning_final_t }} shows ({{ metallica_album_ride_the_lightning_final_t_cal }}); Kill 'Em All perdeu {{ metallica_album_kill_em_all_abandoned }} de {{ metallica_album_kill_em_all_songs }}, mas só após uma mediana de {{ metallica_album_kill_em_all_median }} shows ({{ metallica_album_kill_em_all_median_cal }})."
      5: "Os dados mostram que a rotação do Metallica subiu, não por quê, e uma queda na idade do repertório em torno do lançamento de um álbum não mostra que o lançamento a causou (veja a página inicial)."
  avenged_sevenfold:
    lead: "O Avenged Sevenfold muda o setlist bem menos do que nos primeiros anos, e dois álbuns dos anos 2010, Hail to the King e The Stage, saíram rápido do set."
    context: "o baterista The Rev morreu no fim de 2009; a sonoridade da banda mudou a partir de Hail to the King (2013)."
    numbers: "A rotação (o quanto o setlist muda de um show para o seguinte) caiu de {{ avenged_sevenfold_rot_first3 }} ({{ avenged_sevenfold_rot_first3_years }}) para {{ avenged_sevenfold_rot_last3 }} ({{ avenged_sevenfold_rot_last3_years }}) nos três primeiros e nos três últimos anos com shows suficientes. The Stage perdeu {{ avenged_sevenfold_album_the_stage_abandoned }} de {{ avenged_sevenfold_album_the_stage_songs }} músicas e Hail to the King {{ avenged_sevenfold_album_hail_to_the_king_abandoned }} de {{ avenged_sevenfold_album_hail_to_the_king_songs }}."
    caveats:
      1: "A maior parte da queda da rotação ocorre entre {{ avenged_sevenfold_rot_2007 }} em 2007 e {{ avenged_sevenfold_rot_2010 }} em 2010."
      2: "The Stage tem mediana de {{ avenged_sevenfold_album_the_stage_median }} shows, mas só foi acompanhado por {{ avenged_sevenfold_album_the_stage_final_t }} shows ({{ avenged_sevenfold_album_the_stage_final_t_cal }}); Hail to the King tem mediana de {{ avenged_sevenfold_album_hail_to_the_king_median }}. No conjunto, {{ avenged_sevenfold_abandoned }} de {{ avenged_sevenfold_songs }} músicas foram abandonadas e a mediana é de {{ avenged_sevenfold_median }} shows ({{ avenged_sevenfold_surv_median_cal }})."
      3: "O álbum mais novo, Life Is But a Dream…, perdeu {{ avenged_sevenfold_album_life_is_but_a_dream_abandoned }} de {{ avenged_sevenfold_album_life_is_but_a_dream_songs }}, mas só foi acompanhado por {{ avenged_sevenfold_album_life_is_but_a_dream_final_t }} shows ({{ avenged_sevenfold_album_life_is_but_a_dream_final_t_cal }})."
      4: "Os últimos três anos com shows suficientes vêm depois de uma lacuna sem shows nos dados entre {{ avenged_sevenfold_gap_from }} e {{ avenged_sevenfold_gap_to }}."
caveats:
  summary: "Ressalvas e limites"
