read:
  label: "How to read"
  age: "Each line is one band. Its height is how many years old the songs played that year were, on average. A rising line means the set leans on older songs; a falling line means newer songs took over."
  rotation: "Each line is one band. Height is how different one show is from the next on the same tour: 0 means the same songs every night, 1 means no song in common. A falling line means a more fixed show; a rising line, a more changeable one."
  rotation_small: "Each panel is one band, on the same scale from 0 (the same songs every night) to 1 (no song in common between consecutive shows). A falling line means the show became more fixed; a rising line, more changeable."
  tours: "Each bar is one tour in one year. A longer bar means older songs were typically played (the median age, in years); the diamond marks the average."
  survival: "Each line follows one album's songs from the night they were first played live. Height is the share still in the setlist (100% at the start): a high, flat line means the songs stayed, a steep drop means they left quickly. The axis counts shows, not years; the grey line marks half."
caveats:
  summary: "Caveats and limits"
