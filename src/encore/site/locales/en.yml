findings:
  arctic_monkeys:
    p:
      1: "Rotation fell from {{ arctic_monkeys_rot_first3 }} ({{ arctic_monkeys_rot_first3_years }}) to {{ arctic_monkeys_rot_last3 }} ({{ arctic_monkeys_rot_last3_years }}) in its first and last three years with enough shows: the set became steadier."
      2: "AM held its place: {{ arctic_monkeys_album_am_abandoned }} of its {{ arctic_monkeys_album_am_songs }} eligible songs were abandoned and {{ arctic_monkeys_album_am_final }} were still in the setlist after {{ arctic_monkeys_album_am_final_t }} shows, while Suck It and See stands at {{ arctic_monkeys_album_suck_it_and_see_final }} after {{ arctic_monkeys_album_suck_it_and_see_final_t }}."
      3: "Overall {{ arctic_monkeys_final }} of its eligible songs were still played after {{ arctic_monkeys_final_t }} shows and the median survival is {{ arctic_monkeys_median }} shows. The Car ({{ arctic_monkeys_album_the_car_final }} after {{ arctic_monkeys_album_the_car_final_t }} shows) is too recent to judge."
  oasis:
    p:
      1: "Rotation fell from {{ oasis_rot_first3 }} ({{ oasis_rot_first3_years }}) to {{ oasis_rot_last3 }} ({{ oasis_rot_last3_years }}) in its first and last three years with enough shows, and was {{ oasis_rot_2025 }} on the 2025 shows."
      2: "Its catalog splits by album: (What's the Story) Morning Glory? lost {{ oasis_album_whats_the_story_morning_glory_abandoned }} of {{ oasis_album_whats_the_story_morning_glory_songs }} eligible songs and {{ oasis_album_whats_the_story_morning_glory_final }} were still played after {{ oasis_album_whats_the_story_morning_glory_final_t }} shows, while Be Here Now lost {{ oasis_album_be_here_now_abandoned }} of {{ oasis_album_be_here_now_songs }} (median {{ oasis_album_be_here_now_median }} shows)."
      3: "Overall {{ oasis_final }} of its eligible songs were still in the setlist after {{ oasis_final_t }} shows. The median survival is {{ oasis_median }} shows, against {{ metallica_median }} for Metallica, but 50 shows cover very different stretches of calendar time for the two bands (see Methodology)."
  linkin_park:
    p:
      1: "Rotation did not fall: it went from {{ linkin_park_rot_first3 }} ({{ linkin_park_rot_first3_years }}) to {{ linkin_park_rot_last3 }} ({{ linkin_park_rot_last3_years }}) in its first and last three years with enough shows, and those last years follow a gap with no shows in the data between {{ linkin_park_gap_from }} and {{ linkin_park_gap_to }}."
      2: "Its first albums last: Hybrid Theory still had {{ linkin_park_album_hybrid_theory_final }} of its songs after {{ linkin_park_album_hybrid_theory_final_t }} shows and Meteora {{ linkin_park_album_meteora_final }} after {{ linkin_park_album_meteora_final_t }}. The Hunting Party lost {{ linkin_park_album_the_hunting_party_abandoned }} of {{ linkin_park_album_the_hunting_party_songs }} (median {{ linkin_park_album_the_hunting_party_median }} shows) and One More Light {{ linkin_park_album_one_more_light_abandoned }} of {{ linkin_park_album_one_more_light_songs }} (median {{ linkin_park_album_one_more_light_median }})."
      3: "From Zero has lost {{ linkin_park_album_from_zero_abandoned }} of its {{ linkin_park_album_from_zero_songs }} songs so far, but its curve covers only {{ linkin_park_album_from_zero_final_t }} shows, too short to say how long they will stay. Overall the median survival is {{ linkin_park_median }} shows."
  twenty_one_pilots:
    p:
      1: "Rotation fell from {{ twenty_one_pilots_rot_first3 }} ({{ twenty_one_pilots_rot_first3_years }}) to {{ twenty_one_pilots_rot_last3 }} ({{ twenty_one_pilots_rot_last3_years }}) in its first and last three years with enough shows: the set became almost fixed."
      2: "Blurryface is the album that stayed: {{ twenty_one_pilots_album_blurryface_abandoned }} of {{ twenty_one_pilots_album_blurryface_songs }} songs abandoned and {{ twenty_one_pilots_album_blurryface_final }} still played after {{ twenty_one_pilots_album_blurryface_final_t }} shows. Scaled and Icy lost {{ twenty_one_pilots_album_scaled_and_icy_abandoned }} of {{ twenty_one_pilots_album_scaled_and_icy_songs }} with a median of {{ twenty_one_pilots_album_scaled_and_icy_median }} shows, though its curve covers only {{ twenty_one_pilots_album_scaled_and_icy_final_t }} shows."
      3: "Its earliest albums have left the set: {{ twenty_one_pilots_album_twenty_one_pilots_abandoned }} of {{ twenty_one_pilots_album_twenty_one_pilots_songs }} songs of Twenty One Pilots (median {{ twenty_one_pilots_album_twenty_one_pilots_median }} shows) and {{ twenty_one_pilots_album_vessel_abandoned }} of {{ twenty_one_pilots_album_vessel_songs }} of Vessel (median {{ twenty_one_pilots_album_vessel_median }}). Overall the median survival is {{ twenty_one_pilots_median }} shows."
  muse:
    p:
      1: "Rotation fell from {{ muse_rot_first3 }} ({{ muse_rot_first3_years }}) to {{ muse_rot_last3 }} ({{ muse_rot_last3_years }}) in its first and last three years with enough shows, with a spike of {{ muse_rot_2018 }} in 2018 in between."
      2: "{{ muse_surv_500 }} of its eligible songs were still in the setlist 500 shows after their live debut, and {{ muse_final }} after {{ muse_final_t }} shows, where its data ends."
      3: "Its debut faded: {{ muse_album_showbiz_abandoned }} of {{ muse_album_showbiz_songs }} eligible songs from Showbiz were abandoned (median {{ muse_album_showbiz_median }} shows), while Absolution still had {{ muse_album_absolution_final }} after {{ muse_album_absolution_final_t }} shows. Its earliest years are thin: only {{ muse_1995_rate }} of 1995 performances matched the catalog."
  metallica:
    p:
      1: "Rotation rose from {{ metallica_rot_first3 }} in its first three years with enough shows ({{ metallica_rot_first3_years }}) to {{ metallica_rot_last3 }} in its last three. By tour it was {{ metallica_tour_world_magnetic_rotation }} on World Magnetic (2008–2010) and {{ metallica_tour_m72_world_tour_rotation }} on the M72 World Tour (2023–2026), and by year {{ metallica_rot_2023 }} in 2023 and {{ metallica_rot_2024 }} in 2024."
      2: "Its average repertoire age fell by {{ dip_metallica_death_magnetic_size }}, {{ dip_metallica_hardwired_size }} and {{ dip_metallica_72_seasons_size }} years around Death Magnetic (2008), Hardwired… to Self-Destruct (2016) and 72 Seasons (2023), the clearest such pattern in the data (the home page compares the other bands)."
      3: "Some early albums last very long: Ride the Lightning lost {{ metallica_album_ride_the_lightning_abandoned }} of {{ metallica_album_ride_the_lightning_songs }} eligible songs and {{ metallica_album_ride_the_lightning_final }} were still played after {{ metallica_album_ride_the_lightning_final_t }} shows, while Kill 'Em All lost {{ metallica_album_kill_em_all_abandoned }} of {{ metallica_album_kill_em_all_songs }} but only after a median of {{ metallica_album_kill_em_all_median }} shows. The overall median is {{ metallica_median }} shows; 50 shows cover a longer stretch of time for Metallica than for the busiest-touring bands, so compare with care (see Methodology)."
  avenged_sevenfold:
    p:
      1: "Rotation fell from {{ avenged_sevenfold_rot_first3 }} ({{ avenged_sevenfold_rot_first3_years }}) to {{ avenged_sevenfold_rot_last3 }} ({{ avenged_sevenfold_rot_last3_years }}), with most of the drop between {{ avenged_sevenfold_rot_2007 }} in 2007 and {{ avenged_sevenfold_rot_2010 }} in 2010."
      2: "Its 2010s albums did not hold: The Stage lost {{ avenged_sevenfold_album_the_stage_abandoned }} of {{ avenged_sevenfold_album_the_stage_songs }} songs (median {{ avenged_sevenfold_album_the_stage_median }} shows, though its curve covers only {{ avenged_sevenfold_album_the_stage_final_t }}) and Hail to the King {{ avenged_sevenfold_album_hail_to_the_king_abandoned }} of {{ avenged_sevenfold_album_hail_to_the_king_songs }} (median {{ avenged_sevenfold_album_hail_to_the_king_median }})."
      3: "Overall {{ avenged_sevenfold_abandoned }} of its {{ avenged_sevenfold_songs }} eligible songs were abandoned and the median survival is {{ avenged_sevenfold_median }} shows. The newest album, Life Is But a Dream…, has lost {{ avenged_sevenfold_album_life_is_but_a_dream_abandoned }} of {{ avenged_sevenfold_album_life_is_but_a_dream_songs }}, but its curve covers only {{ avenged_sevenfold_album_life_is_but_a_dream_final_t }} shows."
