  metallica:
    lead: "Metallica went from a nearly fixed show in the 1980s to one that changes a lot, and its setlist got younger after each of its last three albums."
    numbers: "Rotation, how much the songs change from one concert to the next, rose from {{ metallica_rot_first3 }} in its first three years with enough shows ({{ metallica_rot_first3_years }}) to {{ metallica_rot_last3 }} in its last three. By tour it was {{ metallica_tour_world_magnetic_rotation }} on World Magnetic (2008–2010) and {{ metallica_tour_m72_world_tour_rotation }} on the M72 World Tour (2023–2026), and by year {{ metallica_rot_2023 }} in 2023 and {{ metallica_rot_2024 }} in 2024. Its average repertoire age (how old the songs played were) fell by {{ dip_metallica_death_magnetic_size }}, {{ dip_metallica_hardwired_size }} and {{ dip_metallica_72_seasons_size }} years around Death Magnetic (2008), Hardwired… to Self-Destruct (2016) and 72 Seasons (2023). Ride the Lightning lost {{ metallica_album_ride_the_lightning_abandoned }} of {{ metallica_album_ride_the_lightning_songs }} eligible songs and {{ metallica_album_ride_the_lightning_final }} were still played after {{ metallica_album_ride_the_lightning_final_t }} shows, while Kill 'Em All lost {{ metallica_album_kill_em_all_abandoned }} of {{ metallica_album_kill_em_all_songs }} but only after a median of {{ metallica_album_kill_em_all_median }} shows."
