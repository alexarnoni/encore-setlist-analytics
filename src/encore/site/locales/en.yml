findings:
  common: "Survival is counted in shows, not years, and years with fewer than {{ min_pairs }} pairs of consecutive shows are left out of rotation (see Methodology)."
  arctic_monkeys:
    lead: "Arctic Monkeys play a steadier show now than in their early years."
    numbers: "Rotation, how much the songs change from one concert to the next, fell from {{ arctic_monkeys_rot_first3 }} ({{ arctic_monkeys_rot_first3_years }}) to {{ arctic_monkeys_rot_last3 }} ({{ arctic_monkeys_rot_last3_years }}) in its first and last three years with enough shows. AM lost {{ arctic_monkeys_album_am_abandoned }} of its {{ arctic_monkeys_album_am_songs }} eligible songs and {{ arctic_monkeys_album_am_final }} were still in the setlist after {{ arctic_monkeys_album_am_final_t }} shows, while Suck It and See stands at {{ arctic_monkeys_album_suck_it_and_see_final }} after {{ arctic_monkeys_album_suck_it_and_see_final_t }}. Overall {{ arctic_monkeys_final }} of its eligible songs were still played after {{ arctic_monkeys_final_t }} shows, and the median survival is {{ arctic_monkeys_median }} shows."
    caveats:
      1: "The Car ({{ arctic_monkeys_album_the_car_final }} after {{ arctic_monkeys_album_the_car_final_t }} shows) is too recent to judge."
  oasis:
    lead: "Oasis played an almost fixed show, and (What's the Story) Morning Glory? is the album whose songs stayed in it the most."
    numbers: "Rotation, how much the songs change from one concert to the next, fell from {{ oasis_rot_first3 }} ({{ oasis_rot_first3_years }}) to {{ oasis_rot_last3 }} ({{ oasis_rot_last3_years }}) in its first and last three years with enough shows, and was {{ oasis_rot_2025 }} on the 2025 shows. (What's the Story) Morning Glory? lost {{ oasis_album_whats_the_story_morning_glory_abandoned }} of {{ oasis_album_whats_the_story_morning_glory_songs }} eligible songs and {{ oasis_album_whats_the_story_morning_glory_final }} were still played after {{ oasis_album_whats_the_story_morning_glory_final_t }} shows, while Be Here Now lost {{ oasis_album_be_here_now_abandoned }} of {{ oasis_album_be_here_now_songs }} (median {{ oasis_album_be_here_now_median }} shows). Overall {{ oasis_final }} of its eligible songs were still in the setlist after {{ oasis_final_t }} shows, and the median survival is {{ oasis_median }} shows."
    caveats:
      1: "The last three years with enough shows include 2025, after a gap with no shows in the data between {{ oasis_gap_from }} and {{ oasis_gap_to }}."
      2: "Dig Out Your Soul ({{ oasis_album_dig_out_your_soul_final }} after {{ oasis_album_dig_out_your_soul_final_t }} shows, {{ oasis_album_dig_out_your_soul_songs }} songs) is too short a curve to judge."
      3: "The median survival is {{ oasis_median }} shows against {{ metallica_median }} for Metallica, but 50 shows cover very different stretches of calendar time for the two bands (see Methodology)."
  linkin_park:
    lead: "Linkin Park's setlist did not become steadier over time, and its early albums kept more songs in the set than most of its later ones."
    numbers: "Rotation, how much the songs change from one concert to the next, went from {{ linkin_park_rot_first3 }} ({{ linkin_park_rot_first3_years }}) to {{ linkin_park_rot_last3 }} ({{ linkin_park_rot_last3_years }}) in its first and last three years with enough shows. Hybrid Theory still had {{ linkin_park_album_hybrid_theory_final }} of its songs after {{ linkin_park_album_hybrid_theory_final_t }} shows and Meteora {{ linkin_park_album_meteora_final }} after {{ linkin_park_album_meteora_final_t }}, while The Hunting Party lost {{ linkin_park_album_the_hunting_party_abandoned }} of {{ linkin_park_album_the_hunting_party_songs }} (median {{ linkin_park_album_the_hunting_party_median }} shows) and One More Light {{ linkin_park_album_one_more_light_abandoned }} of {{ linkin_park_album_one_more_light_songs }} (median {{ linkin_park_album_one_more_light_median }}). Overall the median survival is {{ linkin_park_median }} shows."
    caveats:
      1: "Its last three years with enough shows follow a gap with no shows in the data between {{ linkin_park_gap_from }} and {{ linkin_park_gap_to }}."
      2: "From Zero has lost {{ linkin_park_album_from_zero_abandoned }} of its {{ linkin_park_album_from_zero_songs }} songs so far, but its curve covers only {{ linkin_park_album_from_zero_final_t }} shows, too short to say how long they will stay."
  twenty_one_pilots:
    lead: "Twenty One Pilots turned into an almost fixed show, and Blurryface is the album that stayed."
