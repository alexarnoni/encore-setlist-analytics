      1: "The overall median is {{ metallica_median }} shows; 50 shows cover a longer stretch of time for Metallica than for the busiest-touring bands, so compare with care (see Methodology)."
      2: "The data shows that Metallica's rotation rose, not why, and a dip in repertoire age around an album release does not show that the release caused it (see the home page)."
