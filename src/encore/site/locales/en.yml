home:
  kicker: how bands use their own catalog
  title: How bands use their own catalog
  lede: "Encore measures how seven bands use their own catalog on stage: how old their setlists are, how much they change from night to night, and how long a song lasts. Every number comes from aggregated setlist data; how it is built is on the methodology page."
  f1:
    kicker: "01 repertoire age"
    h: "New albums can make a setlist younger for a year or two: clearly for Metallica, weakly for Avenged Sevenfold and Linkin Park"
    stat_label: "years off Metallica's average repertoire age in 2023, the year of 72 Seasons: from {{ dip_metallica_72_seasons_before }} in 2022 to {{ dip_metallica_72_seasons_low }}"
    p:
      1: "Metallica's average repertoire age fell around each of its three latest albums: from {{ dip_metallica_death_magnetic_before }} to {{ dip_metallica_death_magnetic_low }} years between 2007 and 2009 (Death Magnetic, 2008), from {{ dip_metallica_hardwired_before }} to {{ dip_metallica_hardwired_low }} between 2015 and 2018 (Hardwired… to Self-Destruct, 2016) and from {{ dip_metallica_72_seasons_before }} to {{ dip_metallica_72_seasons_low }} between 2022 and 2023 (72 Seasons, 2023). Each time it climbed again within one to two years, to {{ dip_metallica_death_magnetic_after }} in 2010, {{ dip_metallica_hardwired_after }} in 2019 and {{ dip_metallica_72_seasons_after }} in 2025."
      2: "For Avenged Sevenfold and Linkin Park the pattern is weaker and not consistent. Avenged Sevenfold's average age dipped by {{ dip_avenged_nightmare_size }} years around Nightmare (2010) and by {{ dip_avenged_hail_to_the_king_size }} around Hail to the King (2013), but rose from {{ dip_avenged_the_stage_before }} to {{ dip_avenged_the_stage_low }} in 2016, the year of The Stage. Linkin Park's dipped by {{ dip_linkin_minutes_to_midnight_size }} years around Minutes to Midnight (2007) and {{ dip_linkin_a_thousand_suns_size }} around A Thousand Suns (2010), but rose from {{ dip_linkin_living_things_before }} to {{ dip_linkin_living_things_low }} in 2012, the year of Living Things. These dips are a fraction of Metallica's: a clear pattern for one band and only a hint for the other two."
      3: "Album release years come from MusicBrainz and were added to this text by hand; the data behind the charts does not carry them. Repertoire age also moves with touring and setlist choices unrelated to new albums, so a dip that coincides with a release does not show that the release caused it."
    title: "Repertoire age by year: Metallica, Avenged Sevenfold and Linkin Park"
    desc: "Line chart of the average repertoire age by year for Metallica, Avenged Sevenfold and Linkin Park. The data table below lists every value."
    caption: "Average repertoire age of the songs played in each year, weighted by performances."
  f2:
    kicker: "02 rotation"
    h: "Most bands settled into a steadier show over time; Metallica went the other way, and Linkin Park did not settle either"
    p:
      1: "Comparing each band's first three years with enough shows to its last three, rotation fell for Arctic Monkeys ({{ arctic_monkeys_rot_first3 }} → {{ arctic_monkeys_rot_last3 }}), Oasis ({{ oasis_rot_first3 }} → {{ oasis_rot_last3 }}), Twenty One Pilots ({{ twenty_one_pilots_rot_first3 }} → {{ twenty_one_pilots_rot_last3 }}), Muse ({{ muse_rot_first3 }} → {{ muse_rot_last3 }}) and Avenged Sevenfold ({{ avenged_sevenfold_rot_first3 }} → {{ avenged_sevenfold_rot_last3 }}). It did not fall for Linkin Park ({{ linkin_park_rot_first3 }} → {{ linkin_park_rot_last3 }}), whose last three years ({{ linkin_park_rot_last3_years }}) follow a gap with no shows in the data between {{ linkin_park_gap_from }} and {{ linkin_park_gap_to }}, and it rose sharply for Metallica ({{ metallica_rot_first3 }} → {{ metallica_rot_last3 }})."
      2: "On its 1980s tours Metallica's rotation was between {{ metallica_tour_kill_em_all_for_one_rotation }} (Kill 'Em All for One, 1983) and {{ metallica_tour_damaged_justice_rotation }} (Damaged Justice, 1988–1989). It was {{ metallica_tour_world_magnetic_rotation }} on World Magnetic (2008–2010) and {{ metallica_tour_m72_world_tour_rotation }} on the M72 World Tour (2023–2026); by calendar year it was {{ metallica_rot_2023 }} in 2023 and {{ metallica_rot_2024 }} in 2024."
      3: "Rotation is measured between consecutive shows of the same tour, so a band that plays one fixed set on tour scores near 0 however large its catalog is. The data shows that Metallica changed; it does not say why. Years with fewer than {{ min_pairs }} show pairs are left out of the averages."
    cell_title: "{{ band }}: rotation by year"
    cell_desc: "Line chart of the rotation of {{ band }} by year, on a scale from 0 to 1."
  f3:
    kicker: "03 song survival"
    h: "500 shows after their live debut, between {{ linkin_park_surv_500 }} (Linkin Park) and {{ metallica_surv_500 }} (Metallica) of a band's songs are still in the setlist"
    stat_label: "of Oasis's eligible songs are still in the setlist 500 shows after their live debut, with {{ oasis_atrisk_500 }} songs still followed at that point"
    p:
      1: "To compare bands fairly, every band is read at the same horizon: 500 shows after a song's live debut, which every band's curve reaches. There, the share of eligible songs still in the setlist is {{ metallica_surv_500 }} for Metallica, {{ twenty_one_pilots_surv_500 }} for Twenty One Pilots, {{ avenged_sevenfold_surv_500 }} for Avenged Sevenfold, {{ muse_surv_500 }} for Muse, {{ arctic_monkeys_surv_500 }} for Arctic Monkeys, {{ oasis_surv_500 }} for Oasis and {{ linkin_park_surv_500 }} for Linkin Park. Each of these rests on at least {{ linkin_park_atrisk_500 }} songs still being followed."
      2: "Where each curve ends is a per-band detail, not a ranking, because it depends on how long the band was followed and a longer career ends lower. Arctic Monkeys end at {{ arctic_monkeys_final }} after {{ arctic_monkeys_final_t }} shows, Oasis at {{ oasis_final }} after {{ oasis_final_t }}, Linkin Park at {{ linkin_park_final }} after {{ linkin_park_final_t }}, Twenty One Pilots at {{ twenty_one_pilots_final }} after {{ twenty_one_pilots_final_t }}, Muse at {{ muse_final }} after {{ muse_final_t }}, Metallica at {{ metallica_final }} after {{ metallica_final_t }} and Avenged Sevenfold at {{ avenged_sevenfold_final }} after {{ avenged_sevenfold_final_t }}. Oasis's curve is nearly flat between the two points: {{ oasis_surv_500 }} at 500 shows and {{ oasis_final }} at {{ oasis_final_t }}."
      3: "Within Oasis the split is by album. (What's the Story) Morning Glory? lost {{ oasis_album_whats_the_story_morning_glory_abandoned }} of its {{ oasis_album_whats_the_story_morning_glory_songs }} eligible songs and {{ oasis_album_whats_the_story_morning_glory_final }} were still played after {{ oasis_album_whats_the_story_morning_glory_final_t }} shows; Definitely Maybe stands at {{ oasis_album_definitely_maybe_final }} after {{ oasis_album_definitely_maybe_final_t }} shows; Be Here Now lost {{ oasis_album_be_here_now_abandoned }} of {{ oasis_album_be_here_now_songs }}, with a median survival of {{ oasis_album_be_here_now_median }} shows."
      4: "Dig Out Your Soul shows {{ oasis_album_dig_out_your_soul_final }} still played, but its curve stops at {{ oasis_album_dig_out_your_soul_final_t }} shows and covers only {{ oasis_album_dig_out_your_soul_songs }} songs: a short, censored curve that cannot settle whether those songs will stay. The end of any curve rests on the few songs still being followed, and follow-up is counted in shows, not years (see Methodology)."
    title: "Oasis: song survival by album"
    desc: "Kaplan-Meier curves of the share of Oasis songs still played after t shows, one per album. The data table below gives the share at 25, 50, 100, 200 and 400 shows."
    caption: "Kaplan-Meier curves, window N = {{ n_window }} shows."
  bands:
    h: The bands
    p: "One page per band, with its own charts and findings."
comparison:
  kicker: seven bands, one scale
  title: Comparison
  lede: The same measures for every band, on the same axes.
  age:
    h: Repertoire age by year
    p: "Average number of years between a song's first release and the night it is played. A line that climbs is a band leaning on older material; a line that drops is a new album taking over the set."
    title: Repertoire age by year, all bands
    desc: "Line chart of average repertoire age by year for the seven bands. The data table below lists every value."
    caption: "Average repertoire age of the songs played in each year, weighted by performances."
  rotation:
    h: Rotation by year
    p: "How much a band changes its setlist from one show to the next within a tour. 0 is the same setlist every night; 1 is no song in common."
    title: Rotation by year, all bands
    desc: "Line chart of rotation by year for the seven bands. The data table below lists every value."
    caption: "Rotation between consecutive shows of the same tour, by year."
  survival:
    h: Median survival by band
    p: "How many shows a song lasts in the live repertoire, counted from its live debut to its last appearance. The median is the number of shows after which half of a band's songs have been abandoned; it is not reached when fewer than half ever are."
    note: "Measured in shows, not in time (see Methodology): 50 shows cover a very different span for each band. Abandoned means the song left the setlist for at least 50 shows and did not return; censored means it is still played, or it returned."
methodology:
  kicker: how the numbers are built
  title: Methodology
  lede: How the numbers on this site are built, what they can and cannot support, and where the data is thin.
  scope:
    h: Scope and sources
    p:
      1: "Encore follows {{ bands_count }} bands ({{ band_list }}), fixed for this version. Setlists (which songs were played at which shows) come from setlist.fm; the catalog (albums, singles, tracks and release dates) comes from MusicBrainz."
      2: "Everything here is computed from {{ shows_total }} shows and published only as aggregates: by band, tour, year and album."
  kpi:
    h: What the numbers mean
    item:
      1: "<strong>Catalog match.</strong> A performance is matched when its title resolves to a song in the MusicBrainz catalog. The share of matched performances, weighted by how often each song was played, is the main data-quality measure (table below). The share matched to a studio album is shown next to it for information only."
      2: "<strong>What is left out.</strong> Covers, tape entries and intros are excluded from catalog figures. Medleys (titles joined by ' / ') are split into separate songs."
      3: "<strong>Repertoire age.</strong> For each performance, the year of the show minus the song's first official release year (the earlier of its studio album's year and its recording's first release), never below zero. A year's figure is the mean over its performances. On the tour chart each bar is the median of one tour in one year, because a median cannot be rebuilt across several years."
      4: "<strong>Rotation.</strong> For consecutive shows of the same tour, the overlap between the two setlists (Jaccard index) is computed. Rotation is 1 minus the mean overlap: 0 means the same setlist every night, 1 means no song in common. Tours with fewer than 5 shows are not scored, and a pair belongs to the year of its second show. Years with fewer than 5 pairs are drawn as hollow markers and left out of the line."
      5: "<strong>Album of a song.</strong> The earliest studio album that contains it. Songs matched to the catalog but not to a studio album (singles, B-sides, other recordings) form their own group, non-album, instead of being dropped."
  survival:
    h: Song survival and the abandonment rule
    p:
      1: "Survival is measured in shows, not in calendar time, so that a hiatus is not read as abandoning songs. A song's duration runs from its first show to its last, inclusive: a song played at one show only lasts 1."
      2: "A song is abandoned when it left the setlist and did not come back: its last appearance is at least N shows before the end of the history, with N = 50 by default. Every other song is censored: it is still being played, or it disappeared for a while and returned. Only catalog songs with at least 3 performances, matched to a studio album or to a recording with a known release year, enter the analysis."
      3: "Only the final gap counts. An earlier version treated the first gap as the event and marked classics that were rested for a tour and brought back as abandoned; the final-gap rule fixes that."
      4: "Comparisons between bands are made at a common horizon, 500 shows after a song's live debut, which every band's curve reaches, and not at the end of each curve: how far a curve extends depends on how long the band was followed, so a band with a longer career would end lower for that reason alone. The end of each curve is still given per band, with the number of shows it covers."
  sensitivity:
    h: How much does N matter?
    p:
      1: "Median survival, in shows, of each band's eligible songs for three window sizes. Where the median barely moves, the choice of N is not driving the result; where it moves a lot, read the figure with that in mind."
    note: "Not reached: the curve never drops below 50%."
  policy:
    h: Data policy
    p:
      1: "Raw setlist.fm data exists only while the pipeline runs and is deleted at the end of every run. Only aggregated results are kept and published, so this site never shows an individual setlist, show date, venue or setlist.fm identifier."
      2: "Song titles, where they appear, are canonical MusicBrainz titles (CC0). Setlist data is credited to <a href='{{ setlistfm_url }}'>setlist.fm</a> and used for non-commercial purposes only; catalog data comes from <a href='{{ musicbrainz_url }}'>MusicBrainz</a>."
  limits:
    h: Known limitations
    item:
      1: "<strong>A window in shows is not a window in time.</strong> Fifty shows pass in months for a band that tours heavily and in more than a year for one that does not. From 2015 on, an average active year has about {{ twenty_one_pilots_pairs_avg }} show pairs for Twenty One Pilots (its busiest year has {{ twenty_one_pilots_pairs_max }}), {{ arctic_monkeys_pairs_avg }} for Arctic Monkeys, {{ muse_pairs_avg }} for Muse, {{ oasis_pairs_avg }} for Oasis, and {{ metallica_pairs_avg }}, {{ avenged_sevenfold_pairs_avg }} and {{ linkin_park_pairs_avg }} for Metallica, Avenged Sevenfold and Linkin Park (pairs slightly undercount shows). Compare bands with this in mind."
      2: "<strong>Muse, 1994 and 1995.</strong> Catalog match is low in Muse's two earliest years: {{ muse_1994_matched }} of {{ muse_1994_performances }} performances matched in 1994 and {{ muse_1995_matched }} of {{ muse_1995_performances }} in 1995 ({{ muse_1995_rate }}). Together they are {{ muse_weak_share }} of Muse's performances, so the overall match ({{ muse_match }}) barely moves, but Muse figures for those years are thin. Likely cause: early demos and EPs that are not in the catalog kept here."
      3: "<strong>Jams, solos and generic entries</strong> such as '(jam)' cannot be told apart reliably in the data, so where they match a catalog song they are counted like any other. This can enlarge setlists, lower the overlap between shows and add spurious songs to survival."
      4: "<strong>Recordings without a release year</strong> cannot be placed on the catalog timeline and are left out of survival. Recording-only songs that do have a year are included under non-album."
      5: "<strong>Release dates come from MusicBrainz</strong> and can be wrong. Suspicious cases are reviewed and corrected through a manual override list in the repository."
  match:
    h: Match quality by band
    p:
      1: "Share of performances matched to the catalog, weighted by plays (the main measure), and the share matched to a studio album (secondary, informational)."
about:
  kicker: what this is
  title: About
  lede: Encore is a non-commercial data portfolio project about how bands use their own catalog in live shows.
  purpose:
    h: What it is for
    p:
      1: "It asks how seven bands treat their catalog on stage: do they live off their past or bet on new material, do shows change from night to night, and how long does a song survive in the live repertoire. Two more questions, show structure and differences by country or venue type, are planned for later versions."
      2: "It is also a worked example of a small end-to-end data pipeline, with the method written down next to the charts."
  stack:
    h: How it is built
    item:
      1: "<strong>Ingestion.</strong> Python clients for the setlist.fm and MusicBrainz APIs, orchestrated by Apache Airflow (LocalExecutor) in Docker Compose on an ARM64 virtual machine."
      2: "<strong>Storage and transformation.</strong> PostgreSQL 16 and dbt Core. Raw setlist.fm data lives in an ephemeral schema truncated at the end of every run; staging and intermediate models are views; only aggregated marts persist."
      3: "<strong>Analysis.</strong> pandas and lifelines (Kaplan-Meier) for rotation and song survival."
      4: "<strong>This site.</strong> A static site generated from the marts with Python, Jinja2 and matplotlib (charts are inline SVG, with no JavaScript chart library), in Portuguese and English, on Cloudflare Pages. No API and no database at runtime."
  source:
    h: Source
    p:
      1: "The code, the methodology notes and the specs are on <a href='{{ repo_url }}'>GitHub</a>. Built by <a href='{{ author_url }}'>alexarnoni</a>."
