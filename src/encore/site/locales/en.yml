findings:
  common: "Survival is counted in shows, not years, and years with fewer than {{ min_pairs }} pairs of consecutive shows are left out of rotation. Only discography songs (found in MusicBrainz) played at least 3 times enter survival (see Methodology)."
  calendar: "The conversion of shows into years uses {{ band }}'s average shows per year in the data (about {{ per_year }}, counting only years with shows and only the shows on setlist.fm) and is approximate."
  arctic_monkeys:
    lead: "Arctic Monkeys play a steadier show now than in their early years."
    context: "the band moved from the garage rock of its early records to the more elaborate, arranged sound of AM (2013) and The Car (2022), and the show became more planned."
    numbers: "Rotation (how much the setlist changes from one show to the next) fell from {{ arctic_monkeys_rot_first3 }} ({{ arctic_monkeys_rot_first3_years }}) to {{ arctic_monkeys_rot_last3 }} ({{ arctic_monkeys_rot_last3_years }}) in its first and last three years with enough shows. The album AM kept {{ arctic_monkeys_album_am_final }} of its songs in the setlist at the end of the data. Overall, half of the band's songs leave the setlist after {{ arctic_monkeys_median }} shows, {{ arctic_monkeys_surv_median_cal }} of touring."
