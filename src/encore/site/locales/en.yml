home:
  kicker: how bands use their own discography
  title: How bands use their own discography
  lede: "This site shows what seven bands played at their concerts, night after night, across their whole careers: the songs of each show, known as a setlist. The setlists come from setlist.fm, where fans fill them in, and the discography (albums, singles, release dates) comes from MusicBrainz. From that we measure three things: how old the songs a band plays are, how much its show changes from one night to the next, and how long a song keeps being played."
  lede_note: "Every number comes from aggregated data; how it is built is on the methodology page."
  f1:
    kicker: "01 how old the songs are"
    h: "After each of its last three albums, Metallica's setlist got younger for a while, then aged again."
    stat_label: "years off Metallica's setlist in 2023, the year of 72 Seasons"
    numbers: "Repertoire age is how old the songs played on a given night were, counted from each song's release. Metallica's average repertoire age fell from {{ dip_metallica_72_seasons_before }} years in 2022 to {{ dip_metallica_72_seasons_low }} in 2023, the year of 72 Seasons ({{ dip_metallica_72_seasons_size }} years less); around Death Magnetic (2008) and Hardwired… to Self-Destruct (2016) the falls were {{ dip_metallica_death_magnetic_size }} and {{ dip_metallica_hardwired_size }} years, and it climbed again within one to two years each time. Avenged Sevenfold's dipped by {{ dip_avenged_nightmare_size }} (Nightmare, 2010) and {{ dip_avenged_hail_to_the_king_size }} years (Hail to the King, 2013) but rose in 2016, the year of The Stage; Linkin Park's dipped by {{ dip_linkin_minutes_to_midnight_size }} (Minutes to Midnight, 2007) and {{ dip_linkin_a_thousand_suns_size }} years (A Thousand Suns, 2010) but rose in 2012, the year of Living Things. The pattern is clear for one band and only a hint for the other two."
    caveats:
      1: "A dip that coincides with an album release does not show that the release caused it: touring and setlist choices also move this number."
      2: "Album release years come from MusicBrainz and were added to this text by hand; the data behind the charts does not carry them."
      3: "Metallica's average repertoire age before, at the low point and after each dip: {{ dip_metallica_death_magnetic_before }} → {{ dip_metallica_death_magnetic_low }} → {{ dip_metallica_death_magnetic_after }} (2007, 2009, 2010), {{ dip_metallica_hardwired_before }} → {{ dip_metallica_hardwired_low }} → {{ dip_metallica_hardwired_after }} (2015, 2018, 2019) and {{ dip_metallica_72_seasons_before }} → {{ dip_metallica_72_seasons_low }} → {{ dip_metallica_72_seasons_after }} (2022, 2023, 2025)."
    title: "Repertoire age by year: Metallica, Avenged Sevenfold and Linkin Park"
    desc: "Line chart of the average repertoire age by year for Metallica, Avenged Sevenfold and Linkin Park. The data table below lists every value."
    caption: "Average repertoire age of the songs played in each year, weighted by how often each song was played."
  f2:
    kicker: "02 how much shows change"
    h: "Most of these bands settled into playing nearly the same show every night; Metallica went the opposite way."
    lead_more: "On its latest tour Metallica played a substantially different set from one night to the next, where in its early years it played nearly the same songs every night."
    numbers: "Rotation is how much the songs change from one concert to the next: 0 means the same songs every night, 1 means none in common. Comparing each band's first three years with enough shows to its last three, rotation fell for Arctic Monkeys ({{ arctic_monkeys_rot_first3 }} → {{ arctic_monkeys_rot_last3 }}), Oasis ({{ oasis_rot_first3 }} → {{ oasis_rot_last3 }}), Twenty One Pilots ({{ twenty_one_pilots_rot_first3 }} → {{ twenty_one_pilots_rot_last3 }}), Muse ({{ muse_rot_first3 }} → {{ muse_rot_last3 }}) and Avenged Sevenfold ({{ avenged_sevenfold_rot_first3 }} → {{ avenged_sevenfold_rot_last3 }}). It did not fall for Linkin Park ({{ linkin_park_rot_first3 }} → {{ linkin_park_rot_last3 }}) and it rose sharply for Metallica ({{ metallica_rot_first3 }} → {{ metallica_rot_last3 }}). Metallica's rotation was between {{ metallica_tour_kill_em_all_for_one_rotation }} (Kill 'Em All for One, 1983) and {{ metallica_tour_damaged_justice_rotation }} (Damaged Justice, 1988–1989) on its 1980s tours, {{ metallica_tour_world_magnetic_rotation }} on World Magnetic (2008–2010) and {{ metallica_tour_m72_world_tour_rotation }} on the M72 World Tour (2023–2026); by year it was {{ metallica_rot_2023 }} in 2023 and {{ metallica_rot_2024 }} in 2024. In song terms, two consecutive shows on the M72 World Tour had on average {{ metallica_tour_m72_world_tour_overlap }} of their combined songs in common, against {{ metallica_tour_damaged_justice_overlap }} to {{ metallica_tour_kill_em_all_for_one_overlap }} on its 1980s tours."
    caveats:
      1: "Rotation compares consecutive shows of the same tour, so a band that plays one fixed set on tour scores near 0 however large its discography is."
      2: "The data shows that Metallica changed, not why."
      3: "Linkin Park's last three years ({{ linkin_park_rot_last3_years }}) follow a gap with no shows in the data between {{ linkin_park_gap_from }} and {{ linkin_park_gap_to }}."
      4: "Years with fewer than {{ min_pairs }} pairs of consecutive shows are left out of the averages; the years behind each figure are listed on the band pages."
    cell_title: "{{ band }}: rotation by year"
    cell_desc: "Line chart of the rotation of {{ band }} by year, on a scale from 0 to 1."
  f3:
    kicker: "03 how long songs last"
    h: "Some albums stay in the live set for a long time, while others fade fast."
    stat_label: "of the {{ oasis_album_whats_the_story_morning_glory_songs }} eligible songs of (What's the Story) Morning Glory? are still played after {{ oasis_album_whats_the_story_morning_glory_final_t }} shows"
    numbers: "Survival is how long a song keeps being played at concerts after its live debut. 500 shows after a song's live debut, the share of a band's songs still in the setlist is {{ metallica_surv_500 }} for Metallica, {{ twenty_one_pilots_surv_500 }} for Twenty One Pilots, {{ avenged_sevenfold_surv_500 }} for Avenged Sevenfold, {{ muse_surv_500 }} for Muse, {{ arctic_monkeys_surv_500 }} for Arctic Monkeys, {{ oasis_surv_500 }} for Oasis and {{ linkin_park_surv_500 }} for Linkin Park. Within Oasis, (What's the Story) Morning Glory? lost {{ oasis_album_whats_the_story_morning_glory_abandoned }} of its {{ oasis_album_whats_the_story_morning_glory_songs }} songs, while Be Here Now lost {{ oasis_album_be_here_now_abandoned }} of {{ oasis_album_be_here_now_songs }}, with a median survival of {{ oasis_album_be_here_now_median }} shows."
    caveats:
      1: "Bands are compared 500 shows after a song's live debut because every band's curve reaches that point, and each figure there rests on at least {{ linkin_park_atrisk_500 }} songs still being followed. Where each curve ends is a per-band detail, not a ranking, since a longer career ends lower: Arctic Monkeys {{ arctic_monkeys_final }} after {{ arctic_monkeys_final_t }}, Oasis {{ oasis_final }} after {{ oasis_final_t }}, Linkin Park {{ linkin_park_final }} after {{ linkin_park_final_t }}, Twenty One Pilots {{ twenty_one_pilots_final }} after {{ twenty_one_pilots_final_t }}, Muse {{ muse_final }} after {{ muse_final_t }}, Metallica {{ metallica_final }} after {{ metallica_final_t }}, Avenged Sevenfold {{ avenged_sevenfold_final }} after {{ avenged_sevenfold_final_t }}."
      2: "Oasis's curve is nearly flat after 500 shows: {{ oasis_surv_500 }} at 500 shows and {{ oasis_final }} at {{ oasis_final_t }}."
      3: "Dig Out Your Soul shows {{ oasis_album_dig_out_your_soul_final }} still played, but its curve stops at {{ oasis_album_dig_out_your_soul_final_t }} shows and covers only {{ oasis_album_dig_out_your_soul_songs }} songs: a short, censored curve (cut off while its songs are still being played) that cannot settle whether those songs will stay."
      4: "The end of any curve rests on the few songs still being followed, and follow-up is counted in shows, not years (see Methodology)."
    title: "Oasis: song survival by album"
    desc: "Kaplan-Meier curves of the share of Oasis songs still played after t shows, one per album. The data table below gives the share at 25, 50, 100, 200 and 400 shows."
    caption: "Kaplan-Meier curves, window N = {{ n_window }} shows."
  bands:
    h: The bands
    p: "One page per band, with its own charts and findings."
comparison:
  kicker: seven bands, one scale
  title: Comparison
  lede: "What seven bands played at their concerts, side by side, from the setlists on setlist.fm: how old the songs were, how much the shows changed from one night to the next and how long songs kept being played. The same measures and the same axes for every band."
  age:
    h: "How old the songs were: repertoire age by year"
    p: "How old the songs played on each night were, on average, counted from each song's release. A line that climbs is a band leaning on older material; a line that drops is a new album taking over the set."
    title: Repertoire age by year, all bands
    desc: "Line chart of average repertoire age by year for the seven bands. The data table below lists every value."
    caption: "Average repertoire age of the songs played in each year, weighted by how often each song was played."
  rotation:
    h: "How much shows change: rotation by year"
    p: "How much a band changes its setlist from one show to the next within a tour. 0 is the same setlist every night; 1 is no song in common."
    title: Rotation by year, all bands
    desc: "Line chart of rotation by year for the seven bands. The data table below lists every value."
    caption: "Rotation between consecutive shows of the same tour, by year."
  survival:
    h: "How long songs last: median survival by band"
    p: "How many shows a song lasts in the live repertoire, counted from its live debut to its last appearance. The median is the number of shows after which half of a band's songs have been abandoned; it is not reached when fewer than half ever are."
    note: "Measured in shows, not in time (see Methodology): 50 shows cover a very different span for each band. Abandoned means the song left the setlist for at least 50 shows and did not return; censored means it is still played, or it returned."
methodology:
  kicker: how the numbers are built
  title: Methodology
  lede: How the numbers on this site are built, what they can and cannot support, and where the data is thin.
  scope:
    h: Scope and sources
    p:
      1: "Encore follows {{ bands_count }} bands ({{ band_list }}), fixed for this version. Setlists (which songs were played at which shows) come from setlist.fm; the discography (albums, singles, tracks and release dates) comes from MusicBrainz."
      2: "Everything here is computed from {{ shows_total }} shows and published only as aggregates: by band, tour, year and album."
  kpi:
    h: What the numbers mean
    item:
      1: "<strong>Match to MusicBrainz.</strong> A performance (one time a song was played at a show) is matched when its title resolves to a song in the MusicBrainz discography. The share of matched performances, weighted by how often each song was played, is the main data-quality measure (table below). The share matched to a studio album is shown next to it for information only."
      2: "<strong>What is left out.</strong> Covers, tape entries and intros are excluded from the measures. Medleys (titles joined by ' / ') are split into separate songs."
      3: "<strong>Repertoire age.</strong> For each performance, the year of the show minus the song's first official release year (the earlier of its studio album's year and its recording's first release), never below zero. A year's figure is the mean over its performances. On the tour chart each bar is the median of one tour in one year, because a median cannot be rebuilt across several years."
      4: "<strong>Rotation.</strong> For consecutive shows of the same tour, the overlap between the two setlists (Jaccard index) is computed. Rotation is 1 minus the mean overlap: 0 means the same setlist every night, 1 means no song in common. Tours with fewer than 5 shows are not scored, and a pair belongs to the year of its second show. Years with fewer than 5 pairs are drawn as hollow markers and left out of the line."
      5: "<strong>Album of a song.</strong> The earliest studio album that contains it. Songs matched to MusicBrainz but not to a studio album (singles, B-sides, other recordings) form their own group, non-album, instead of being dropped."
  survival:
    h: Song survival and the abandonment rule
    p:
      1: "Survival is measured in shows, not in calendar time, so that a hiatus is not read as abandoning songs. A song's duration runs from its first show to its last, inclusive: a song played at one show only lasts 1."
      2: "A song is abandoned when it left the setlist and did not come back: its last appearance is at least N shows before the end of the history, with N = 50 by default. Every other song is censored: it is still being played, or it disappeared for a while and returned. Only discography songs (those found in MusicBrainz) with at least 3 performances, matched to a studio album or to a recording with a known release year, enter the analysis."
      3: "Only the final gap counts. An earlier version treated the first gap as the event and marked classics that were rested for a tour and brought back as abandoned; the final-gap rule fixes that."
      4: "Comparisons between bands are made at a common horizon, 500 shows after a song's live debut, which every band's curve reaches, and not at the end of each curve: how far a curve extends depends on how long the band was followed, so a band with a longer career would end lower for that reason alone. The end of each curve is still given per band, with the number of shows it covers."
  sensitivity:
    h: How much does N matter?
    p:
      1: "Median survival, in shows, of each band's eligible songs for three window sizes. Where the median barely moves, the choice of N is not driving the result; where it moves a lot, read the figure with that in mind."
    note: "Not reached: the curve never drops below 50%."
  policy:
    h: Data policy
    p:
      1: "Raw setlist.fm data exists only while the pipeline runs and is deleted at the end of every run. Only aggregated results are kept and published, so this site never shows an individual setlist, show date, venue or setlist.fm identifier."
      2: "Song titles, where they appear, are canonical MusicBrainz titles (CC0). Setlist data is credited to <a href='{{ setlistfm_url }}'>setlist.fm</a> and used for non-commercial purposes only; discography data comes from <a href='{{ musicbrainz_url }}'>MusicBrainz</a>."
  limits:
    h: Known limitations
    item:
      1: "<strong>A window in shows is not a window in time.</strong> Fifty shows pass in months for a band that tours heavily and in more than a year for one that does not. From 2015 on, an average active year has about {{ twenty_one_pilots_pairs_avg }} show pairs for Twenty One Pilots (its busiest year has {{ twenty_one_pilots_pairs_max }}), {{ arctic_monkeys_pairs_avg }} for Arctic Monkeys, {{ muse_pairs_avg }} for Muse, {{ oasis_pairs_avg }} for Oasis, and {{ metallica_pairs_avg }}, {{ avenged_sevenfold_pairs_avg }} and {{ linkin_park_pairs_avg }} for Metallica, Avenged Sevenfold and Linkin Park (pairs slightly undercount shows). Compare bands with this in mind."
      2: "<strong>Muse, 1994 and 1995.</strong> The match to MusicBrainz is low in Muse's two earliest years: {{ muse_1994_matched }} of {{ muse_1994_performances }} performances matched in 1994 and {{ muse_1995_matched }} of {{ muse_1995_performances }} in 1995 ({{ muse_1995_rate }}). Together they are {{ muse_weak_share }} of Muse's performances, so the overall match ({{ muse_match }}) barely moves, but Muse figures for those years are thin. Likely cause: early demos and EPs that are not in MusicBrainz."
      3: "<strong>Jams, solos and generic entries</strong> such as '(jam)' cannot be told apart reliably in the data, so where they match a discography song they are counted like any other. This can enlarge setlists, lower the overlap between shows and add spurious songs to survival."
      4: "<strong>Recordings without a release year</strong> cannot be placed on the discography timeline and are left out of survival. Recording-only songs that do have a year are included under non-album."
      5: "<strong>Release dates come from MusicBrainz</strong> and can be wrong. Suspicious cases are reviewed and corrected through a manual override list in the repository."
  match:
    h: Match to MusicBrainz by band
    p:
      1: "Share of performances matched to MusicBrainz, weighted by plays (the main measure), and the share matched to a studio album (secondary, informational)."
about:
  kicker: what this is
  title: About
  lede: Encore is a non-commercial data portfolio project about how bands use their own discography in live shows.
  purpose:
    h: What it is for
    p:
      1: "It asks how seven bands treat their own discography on stage: do they live off their past or bet on new material, do shows change from night to night, and how long does a song survive in the live repertoire. Two more questions, show structure and differences by country or venue type, are planned for later versions."
      2: "It is also a worked example of a small end-to-end data pipeline, with the method written down next to the charts."
  stack:
    h: How it is built
    item:
      1: "<strong>Ingestion.</strong> Python clients for the setlist.fm and MusicBrainz APIs, orchestrated by Apache Airflow (LocalExecutor) in Docker Compose on an ARM64 virtual machine."
      2: "<strong>Storage and transformation.</strong> PostgreSQL 16 and dbt Core. Raw setlist.fm data lives in an ephemeral schema truncated at the end of every run; staging and intermediate models are views; only aggregated marts persist."
      3: "<strong>Analysis.</strong> pandas and lifelines (Kaplan-Meier) for rotation and song survival."
      4: "<strong>This site.</strong> A static site generated from the marts with Python, Jinja2 and matplotlib (charts are inline SVG, with no JavaScript chart library), in Portuguese and English, on Cloudflare Pages. No API and no database at runtime."
  source:
    h: Source
    p:
      1: "The code, the methodology notes and the specs are on <a href='{{ repo_url }}'>GitHub</a>. Built by <a href='{{ author_url }}'>alexarnoni</a>."
