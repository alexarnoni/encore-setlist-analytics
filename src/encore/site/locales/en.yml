home:
  kicker: how bands use their own discography
  title: How bands use their own discography
  lede: "This site shows what seven bands played at their concerts, night after night, across their whole careers: the songs of each show, known as a setlist. The setlists come from setlist.fm, where fans fill them in, and the discography (albums, singles, release dates) comes from MusicBrainz. From that we measure three things: how old the songs a band plays are, how much its show changes from one night to the next, and how long a song keeps being played."
  lede_note: "Every number comes from aggregated data; how it is built is on the methodology page."
  f1:
    kicker: "01 how old the songs are"
    h: "After each of its last three albums, Metallica's setlist got younger for a while, then aged again."
    stat_label: "years off Metallica's setlist in 2023, the year of 72 Seasons"
    explain: "Repertoire age is how old the songs played on a given night were, counted from each song's release: at 6, the average song of the show was six years old. Each line is one band. A rising line means the set leans on older songs; a falling line means newer songs took over."
    numbers: "Metallica's average repertoire age fell from {{ dip_metallica_72_seasons_before }} years in 2022 to {{ dip_metallica_72_seasons_low }} in 2023, the year of 72 Seasons, and falls of {{ dip_metallica_death_magnetic_size }} and {{ dip_metallica_hardwired_size }} years appear around Death Magnetic (2008) and Hardwired… to Self-Destruct (2016); it climbed again within one to two years each time. Avenged Sevenfold and Linkin Park also dip around releases, but by less, and their age rose in years of a new album (The Stage, 2016; Living Things, 2012): the pattern is clear for one band and only a hint for the other two."
    caveats:
      1: "A dip that coincides with an album release does not show that the release caused it: touring and setlist choices also move this number."
      2: "Album release years come from MusicBrainz and were added to this text by hand; the data behind the charts does not carry them."
      3: "Metallica's average repertoire age before, at the low point and after each dip: {{ dip_metallica_death_magnetic_before }} → {{ dip_metallica_death_magnetic_low }} → {{ dip_metallica_death_magnetic_after }} (2007, 2009, 2010), {{ dip_metallica_hardwired_before }} → {{ dip_metallica_hardwired_low }} → {{ dip_metallica_hardwired_after }} (2015, 2018, 2019) and {{ dip_metallica_72_seasons_before }} → {{ dip_metallica_72_seasons_low }} → {{ dip_metallica_72_seasons_after }} (2022, 2023, 2025). Avenged Sevenfold: dips of {{ dip_avenged_nightmare_size }} (Nightmare, 2010) and {{ dip_avenged_hail_to_the_king_size }} years (Hail to the King, 2013). Linkin Park: {{ dip_linkin_minutes_to_midnight_size }} (Minutes to Midnight, 2007) and {{ dip_linkin_a_thousand_suns_size }} years (A Thousand Suns, 2010)."
    title: "Repertoire age by year: Metallica, Avenged Sevenfold and Linkin Park"
    desc: "Line chart of the average repertoire age by year for Metallica, Avenged Sevenfold and Linkin Park. The data table below lists every value."
    caption: "Average repertoire age of the songs played in each year, weighted by how often each song was played."
  f2:
    kicker: "02 how much shows change"
    h: "Most of these bands settled into playing nearly the same show every night; Metallica went the opposite way."
    lead_more: "On its latest tour Metallica played substantially different sets from one night to the next, partly by design of the tour (see the caveats). In its early years it played nearly the same songs every night."
    explain: "Rotation measures how much the setlist changes from one show to the next on the same tour. Near 0, the band plays practically the same show every night; above 0.5, more than half of the songs across two consecutive nights appear on only one of them; near 1, almost nothing repeats. Each panel is one band, on the same scale from 0 to 1."
    numbers: "Comparing each band's first three years with enough shows to its last three, rotation fell for five of the seven bands; the biggest fall was Twenty One Pilots', from {{ twenty_one_pilots_rot_first3 }} to {{ twenty_one_pilots_rot_last3 }}. Metallica went the opposite way: no 1980s tour went above {{ metallica_tour_damaged_justice_rotation }}, and the M72 World Tour (2023–2026) reached {{ metallica_tour_m72_world_tour_rotation }}."
    caveats:
      1: "On the M72 World Tour Metallica plays two consecutive nights in the same city with different setlists (the 'No Repeat Weekend' format), so much of this high rotation is by design of the tour. That is public context about the tour: the aggregated data carries no cities, so it neither confirms nor rules out the explanation. What it does show is that no song was played at 9 in 10 shows of the tour."
      2: "The format does not explain everything: Metallica's rotation was already {{ metallica_tour_world_magnetic_rotation }} on World Magnetic (2008–2010). By year it was {{ metallica_rot_2023 }} in 2023 and {{ metallica_rot_2024 }} in 2024; two consecutive M72 shows had on average {{ metallica_tour_m72_world_tour_overlap }} of their combined songs in common, against {{ metallica_tour_damaged_justice_overlap }} to {{ metallica_tour_kill_em_all_for_one_overlap }} on the 1980s tours."
      3: "Rotation compares consecutive shows of the same tour, so a band that plays one fixed set on tour scores near 0 however large its discography is. The data shows that Metallica's rotation rose, not why."
      4: "Values in the first three and the last three years with enough shows: Arctic Monkeys {{ arctic_monkeys_rot_first3 }} → {{ arctic_monkeys_rot_last3 }}, Oasis {{ oasis_rot_first3 }} → {{ oasis_rot_last3 }}, Muse {{ muse_rot_first3 }} → {{ muse_rot_last3 }}, Avenged Sevenfold {{ avenged_sevenfold_rot_first3 }} → {{ avenged_sevenfold_rot_last3 }}, Metallica {{ metallica_rot_first3 }} → {{ metallica_rot_last3 }}. It did not fall for Linkin Park ({{ linkin_park_rot_first3 }} → {{ linkin_park_rot_last3 }}), and its last three years ({{ linkin_park_rot_last3_years }}) follow a gap with no shows in the data between {{ linkin_park_gap_from }} and {{ linkin_park_gap_to }}."
      5: "Years with fewer than {{ min_pairs }} pairs of consecutive shows are left out of the averages; the years behind each figure are listed on the band pages."
    cell_title: "{{ band }}: rotation by year"
    cell_desc: "Line chart of the rotation of {{ band }} by year, on a scale from 0 to 1."
  f3:
    kicker: "03 how long songs last"
    h: "Some albums stay in the live set for a long time, while others fade fast."
    stat_label: "of the songs on (What's the Story) Morning Glory? were still being played {{ oasis_album_whats_the_story_morning_glory_final_t }} shows after their live debut ({{ oasis_album_whats_the_story_morning_glory_final_t_cal }} of touring)"
    explain: "Survival is how long a song keeps being played at concerts after its live debut. Each line of the chart is one Oasis album, and its height is the share of that album's songs still in the setlist: a high, flat line means the songs stayed, a steep drop means they left quickly. The axis counts shows, not years: for Oasis, 100 shows are {{ oasis_surv_100_cal }} of touring. The grey line marks half, which Oasis crosses at {{ oasis_median }} shows ({{ oasis_surv_median_cal }})."
    numbers: "Within Oasis, (What's the Story) Morning Glory? lost {{ oasis_album_whats_the_story_morning_glory_abandoned }} of its {{ oasis_album_whats_the_story_morning_glory_songs }} songs, while Be Here Now lost {{ oasis_album_be_here_now_abandoned }} of {{ oasis_album_be_here_now_songs }}, with half of them out of the setlist after {{ oasis_album_be_here_now_median }} shows ({{ oasis_album_be_here_now_median_cal }})."
    caveats:
      1: "Bands are compared 500 shows after a song's live debut because every band's curve reaches that point, and each figure there rests on at least {{ linkin_park_atrisk_500 }} songs still being followed."
      2: "Where each curve ends is a per-band detail, not a ranking, since a longer career ends lower: Arctic Monkeys {{ arctic_monkeys_final }} after {{ arctic_monkeys_final_t }} shows ({{ arctic_monkeys_final_t_cal }}), Oasis {{ oasis_final }} after {{ oasis_final_t }} ({{ oasis_final_t_cal }}), Linkin Park {{ linkin_park_final }} after {{ linkin_park_final_t }} ({{ linkin_park_final_t_cal }}), Twenty One Pilots {{ twenty_one_pilots_final }} after {{ twenty_one_pilots_final_t }} ({{ twenty_one_pilots_final_t_cal }}), Muse {{ muse_final }} after {{ muse_final_t }} ({{ muse_final_t_cal }}), Metallica {{ metallica_final }} after {{ metallica_final_t }} ({{ metallica_final_t_cal }}), Avenged Sevenfold {{ avenged_sevenfold_final }} after {{ avenged_sevenfold_final_t }} ({{ avenged_sevenfold_final_t_cal }})."
      3: "Oasis's curve is nearly flat after 500 shows: {{ oasis_surv_500 }} at 500 shows and {{ oasis_final }} at {{ oasis_final_t }}."
      4: "Dig Out Your Soul shows {{ oasis_album_dig_out_your_soul_final }} still played, but its curve stops at {{ oasis_album_dig_out_your_soul_final_t }} shows ({{ oasis_album_dig_out_your_soul_final_t_cal }}) and covers only {{ oasis_album_dig_out_your_soul_songs }} songs: a short follow-up, cut off while its songs are still being played (a censored curve), that cannot settle whether those songs will stay."
      5: "The end of any curve rests on the few songs still being followed, and follow-up is counted in shows, not years (see Methodology). The conversions to years use each band's average shows per year in the data, counting only years with shows, and are approximate."
      6: "Only songs played at least 3 times and found in the MusicBrainz discography are counted here (see Methodology)."
      7: "Share of songs still in the setlist 500 shows after their live debut: Metallica {{ metallica_surv_500 }}, Twenty One Pilots {{ twenty_one_pilots_surv_500 }}, Avenged Sevenfold {{ avenged_sevenfold_surv_500 }}, Muse {{ muse_surv_500 }}, Arctic Monkeys {{ arctic_monkeys_surv_500 }}, Oasis {{ oasis_surv_500 }} and Linkin Park {{ linkin_park_surv_500 }}."
    title: "Oasis: song survival by album"
    desc: "Kaplan-Meier curves of the share of Oasis songs still played after t shows, one per album. The data table below gives the share at 25, 50, 100, 200 and 400 shows."
    caption: "Kaplan-Meier curves. A song counts as abandoned when it stays out of the setlist for {{ n_window }} shows or more without coming back."
