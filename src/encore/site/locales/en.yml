  metallica:
    lead: "Metallica went from a nearly fixed show in the 1980s to one that changes a lot, and its setlist got younger after each of its last three albums."
    context: "in the 1980s the set was nearly fixed; since the 2000s its tours have varied more, and M72 took that to the limit with the 'No Repeat Weekend' format."
    numbers: "Rotation (how much the setlist changes from one show to the next) rose from {{ metallica_rot_first3 }} in its first three years with enough shows ({{ metallica_rot_first3_years }}) to {{ metallica_rot_last3 }} in its last three. On the M72 World Tour (2023–2026) it reached {{ metallica_tour_m72_world_tour_rotation }}, partly by design of the tour (see the context below and the caveats). Its average repertoire age (how old the songs played were) fell {{ dip_metallica_72_seasons_size }} years around 72 Seasons (2023), and similar falls appeared around Death Magnetic (2008) and Hardwired… to Self-Destruct (2016)."
    caveats:
      1: "On the M72 World Tour Metallica plays two consecutive nights in the same city with different setlists (the 'No Repeat Weekend' format), so much of this high rotation is by design of the tour. That is public context about the tour: the aggregated data carries no cities, so it neither confirms nor rules out the explanation. What it does show is that no song was played at 9 in 10 shows of the tour."
      2: "The format does not explain everything: Metallica's rotation was already {{ metallica_tour_world_magnetic_rotation }} on World Magnetic (2008–2010), and it was {{ metallica_rot_2023 }} in 2023 and {{ metallica_rot_2024 }} in 2024."
      3: "The overall median survival is {{ metallica_median }} shows ({{ metallica_surv_median_cal }}); 50 shows cover a different stretch of time for each band, so compare with care (see Methodology)."
      4: "Ride the Lightning lost {{ metallica_album_ride_the_lightning_abandoned }} of {{ metallica_album_ride_the_lightning_songs }} songs and kept {{ metallica_album_ride_the_lightning_final }} after {{ metallica_album_ride_the_lightning_final_t }} shows ({{ metallica_album_ride_the_lightning_final_t_cal }}); Kill 'Em All lost {{ metallica_album_kill_em_all_abandoned }} of {{ metallica_album_kill_em_all_songs }}, but only after a median of {{ metallica_album_kill_em_all_median }} shows ({{ metallica_album_kill_em_all_median_cal }})."
      5: "The data shows that Metallica's rotation rose, not why, and a dip in repertoire age around an album release does not show that the release caused it (see the home page)."
