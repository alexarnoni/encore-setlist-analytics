version: 2

models:

  - name: int_song_catalog
    description: >
      One row per distinct catalog song per band, keyed by
      (band, title_normalized). Precedence: seed override > studio album >
      MusicBrainz recording. Built from PERSISTENT MusicBrainz data only —
      no setlist.fm data touches this model.
    columns:
      - name: band
        data_tests:
          - not_null
      - name: title_normalized
        description: Join key; normalize_title() of the song title.
        data_tests:
          - not_null
      - name: song_title
        description: Canonical display title.
        data_tests:
          - not_null
      - name: reference_album
        description: >
          Earliest studio album containing the song. NULL for
          catalog_source = 'recording' (no album has it).
      - name: release_year
        description: >
          The song's first official release year: the earlier of the
          reference album's year and the recording's first-release year,
          unless a seed fix (first_release_year) sets it. NULL when there
          is no usable date — such a song can be matched but has no age.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: album_year
        description: Year of the reference album. NULL for 'recording'.
      - name: recording_year
        description: >
          Earliest recording year in MusicBrainz for the song; NULL when
          there is no dated recording.
      - name: release_year_fixed
        description: True when release_year came from a seed fix.
        data_tests:
          - not_null
      - name: catalog_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['album', 'recording', 'override']

  - name: int_performances
    description: >
      One row per performed song (medleys already split), excluding tape
      entries and covers, joined to int_song_catalog. Unmatched songs are
      KEPT (is_matched = false) so the match rate can be measured. A view
      over EPHEMERAL setlist.fm data; carries setlist_id and song names,
      which is allowed here and never in `analytics`.
    columns:
      - name: setlist_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_setlists')
                field: setlist_id
      - name: band
        data_tests:
          - not_null
      - name: show_year
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: song_name_raw
        data_tests:
          - not_null
      - name: title_normalized
        description: >
          The key actually used to join the catalog: the normalized raw
          name, or the normalized CANONICAL title when a seed override maps
          this raw name.
        data_tests:
          - not_null
      - name: catalog_source
        description: NULL for unmatched songs.
        data_tests:
          - accepted_values:
              arguments:
                values: ['album', 'recording', 'override']
      - name: is_matched
        data_tests:
          - not_null
      - name: repertoire_age
        description: >
          show_year - release_year, SIGNED. Negative when the song was
          played before its release year (an unreleased song at that
          show). NULL when unmatched or when either year is unknown.
      - name: used_override_alias
        description: True when a seed_song_overrides row mapped this raw name.
        data_tests:
          - not_null

  - name: int_show_song_sets
    description: >
      One row per show and distinct canonical catalog song (matched songs only,
      no tape or covers), for shows with a usable date. show_key is the setlist
      id: allowed here, never in `analytics`. A view over EPHEMERAL setlist.fm
      data.
    columns:
      - name: show_key
        data_tests:
          - not_null
      - name: band
        data_tests:
          - not_null
      - name: tour_name
        description: "'Unknown tour' when the show has no tour name."
        data_tests:
          - not_null
      - name: show_date
        data_tests:
          - not_null
      - name: song_key
        description: >
          Canonical song key (normalized title after override aliases), unique
          per band in the catalog.
        data_tests:
          - not_null
      - name: song_title
        data_tests:
          - not_null

