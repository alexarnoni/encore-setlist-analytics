version: 2

# analytics = PERSISTENT aggregated marts. Nothing here may carry a
# setlist id, show date, venue or song title (docs/context/structure.md);
# the R7.2 singular test guards that.

models:

  - name: mart_repertoire_age
    description: >
      Average repertoire age by band, tour and year. Repertoire age of a
      performance is show_year minus the song's first official release year
      (the earlier of its album's year and its recording's first-release
      year), with a negative value (song played before its release year) clamped to 0.
      Only matched, non-tape, non-cover performances with a known year
      enter the average. Rebuilt from scratch on every run;
      computed_at is the only column expected to differ between two
      runs on the same data.
    columns:
      - name: band
        data_tests:
          - not_null
      - name: tour_name
        description: "'Unknown tour' when the show has no tour name."
        data_tests:
          - not_null
      - name: show_year
        data_tests:
          - not_null
      - name: shows
        description: Distinct shows with at least one performance in the cell.
        data_tests:
          - not_null
      - name: performances
        description: All non-tape, non-cover performances in the cell.
        data_tests:
          - not_null
      - name: matched_performances
        description: Performances that resolved to the song catalog.
        data_tests:
          - not_null
      - name: aged_performances
        description: >
          Matched performances whose song has a release year, i.e. the ones
          that entered avg_repertoire_age. Never above matched_performances;
          the difference is matched performances of songs with no release
          year.
        data_tests:
          - not_null
      - name: match_rate
        description: matched_performances / performances, between 0 and 1.
        data_tests:
          - not_null
      - name: avg_repertoire_age
        description: >
          NULL only when no matched performance in the cell has a known
          release year.
      - name: median_repertoire_age
      - name: oldest_song_year
        description: Smallest release year among the averaged performances.
      - name: newest_song_year
        description: Largest release year among the averaged performances.
      - name: computed_at
        data_tests:
          - not_null

  - name: mart_match_quality
    description: >
      How well setlist songs resolve to the song catalog, by band and
      year. The headline metric is match_rate_by_performance (weighted by
      plays); match_rate_by_title counts every distinct song once and is
      the harsher view. Counts and rates only — no titles.
    columns:
      - name: band
        data_tests:
          - not_null
      - name: show_year
        data_tests:
          - not_null
      - name: performances
        description: All non-tape, non-cover performances in the band/year.
        data_tests:
          - not_null
      - name: matched_performances
        data_tests:
          - not_null
      - name: match_rate_by_performance
        description: matched_performances / performances, between 0 and 1.
        data_tests:
          - not_null
      - name: distinct_songs
        description: >
          Distinct normalized titles played (after override aliases).
      - name: distinct_songs_matched
      - name: match_rate_by_title
        description: >
          distinct_songs_matched / distinct_songs. NULL only if no
          performance in the cell has a usable title.
      - name: match_rate_by_album
        description: >
          Secondary, informational. Share of performances matched to a song
          with a reference studio album; never above
          match_rate_by_performance. The difference is the share of plays
          on matched songs that are not on a studio album ("non-album").
        data_tests:
          - not_null
      - name: computed_at
        data_tests:
          - not_null

  - name: mart_tour_rotation
    description: >
      How much a band's setlist changes between consecutive shows of the same
      tour (spec-03). Grain: band, tour_name. rotation = 1 - mean Jaccard
      similarity of consecutive-show pairs; 0 means an identical setlist every
      night, 1 means completely different sets each time. Tours with fewer
      than 5 shows, and the 'Unknown tour' bucket, have no row here (rotation
      cannot be measured on them). Rebuilt from scratch on every run;
      computed_at is the only column expected to differ between two runs on
      the same data.
    columns:
      - name: band
        data_tests:
          - not_null
      - name: tour_name
        description: "Never 'Unknown tour' (excluded: not a real tour)."
        data_tests:
          - not_null
      - name: first_year
        data_tests:
          - not_null
      - name: last_year
        data_tests:
          - not_null
      - name: shows
        description: Distinct dated shows of the tour. Always >= 5.
        data_tests:
          - not_null
      - name: pairs
        description: Consecutive show pairs; always shows - 1.
        data_tests:
          - not_null
      - name: mean_jaccard
        data_tests:
          - not_null
      - name: rotation
        description: 1 - mean_jaccard, between 0 and 1.
        data_tests:
          - not_null
      - name: median_setlist_size
        data_tests:
          - not_null
      - name: core_songs
        description: Songs present in at least 90% of the tour's shows.
        data_tests:
          - not_null
      - name: distinct_songs
        data_tests:
          - not_null
      - name: computed_at
        data_tests:
          - not_null

  - name: mart_band_rotation_by_year
    description: >
      Rotation by band and year, weighted by pairs (a pair belongs to the
      year of its second show). Only pairs from tours that qualify for
      mart_tour_rotation are counted, so the two marts agree by construction.
      Rebuilt from scratch on every run; computed_at is the only column
      expected to differ between two runs on the same data.
    columns:
      - name: band
        data_tests:
          - not_null
      - name: show_year
        data_tests:
          - not_null
      - name: pairs
        data_tests:
          - not_null
      - name: mean_jaccard
        data_tests:
          - not_null
      - name: rotation
        description: 1 - mean_jaccard, between 0 and 1.
        data_tests:
          - not_null
      - name: computed_at
        data_tests:
          - not_null
