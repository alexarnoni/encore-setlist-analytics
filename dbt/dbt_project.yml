name: 'encore'
version: '1.0.0'
config-version: 2

profile: 'encore'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layer -> schema, per docs/context/structure.md. generate_schema_name
# (macros/generate_schema_name.sql) makes these exact schema names,
# instead of dbt's default "<profile_schema>_<custom_schema>".
models:
  encore:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    analytics:
      +materialized: table
      +schema: analytics

seeds:
  encore:
    +schema: staging
    # Explicit text types: dbt infers seed column types from the data,
    # so a title like "1984" or "21" would silently become an integer
    # and break string matching against MusicBrainz titles. The overrides
    # seed is also empty (header only), where inference has nothing to
    # go on at all.
    seed_album_exclusions:
      +column_types:
        band: text
        album_title: text
    seed_song_overrides:
      +column_types:
        band: text
        raw_song_name: text
        canonical_song_title: text
        album_title: text

# adjustment 3: CREATE EXTENSION needs superuser, which dbt's own
# connection doesn't have — the extension itself is created by
# infra/postgres/init/03_create_unaccent_extension.sh. This hook only
# checks it exists and fails with a clear message otherwise.
on-run-start:
  - "{{ assert_unaccent_extension_exists() }}"
