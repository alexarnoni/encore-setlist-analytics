name: 'encore'
version: '1.0.0'
config-version: 2

profile: 'encore'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layer -> schema, per docs/context/structure.md. generate_schema_name
# (macros/generate_schema_name.sql) makes these exact schema names,
# instead of dbt's default "<profile_schema>_<custom_schema>".
models:
  encore:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    analytics:
      +materialized: table
      +schema: analytics

seeds:
  encore:
    +schema: staging

# adjustment 3: CREATE EXTENSION needs superuser, which dbt's own
# connection doesn't have — the extension itself is created by
# infra/postgres/init/03_create_unaccent_extension.sh. This hook only
# checks it exists and fails with a clear message otherwise.
on-run-start:
  - "{{ assert_unaccent_extension_exists() }}"
