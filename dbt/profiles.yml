# No literal credentials — every value that could be a secret comes
# from an environment variable (adjustment 2). Safe to commit.
encore:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'postgres') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      # Always the `encore` database specifically — distinct from
      # POSTGRES_DB, which names Airflow's own metadata database (see
      # encore.db.DATABASE_NAME).
      dbname: encore
      schema: staging
      threads: 4
